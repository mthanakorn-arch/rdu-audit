<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>การใช้ยาปฏิชีวนะอย่างสมเหตุผลในการคลอดแบบปกติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A31621; --red-d:#6E0F17; --red-l:#F8ECED;
  --green:#1E6B4F; --gray:#6C6367; --orange:#C2661A;
  --bg:#FAF7F7; --ink:#1B1214;
  --line:#E8DFE0; --line-2:#D9CCCE; --muted:#7C7175; --white:#fff;
  --r:3px;
  --sans:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Noto Serif Thai',Georgia,serif;
  --mono:'IBM Plex Mono','IBM Plex Sans Thai',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--red)}
.mono{font-family:var(--mono)}
.hide{display:none !important}

/* ---------------------------------------------------------------- header */
.hdr{background:var(--red-d);color:#fff;position:sticky;top:0;z-index:60}
.hdr-in{max-width:1240px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
.burger{width:38px;height:38px;border:1px solid rgba(255,255,255,.35);border-radius:var(--r);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex:none}
.burger span{display:block;width:17px;height:1.5px;background:#fff}
.logo{width:38px;height:38px;border:1px solid rgba(255,255,255,.5);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;
  letter-spacing:.5px;flex:none}
.hdr-t{flex:1;min-width:0}
.hdr-t h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-t p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.72);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-btn{border:1px solid rgba(255,255,255,.55);border-radius:var(--r);padding:8px 16px;
  color:#fff;font-size:14px;white-space:nowrap;flex:none;background:transparent}
.hdr-btn:hover{background:rgba(255,255,255,.12)}
.hdr-user{display:flex;align-items:center;gap:10px;font-size:13.5px;color:rgba(255,255,255,.9);flex:none}
.hdr-user b{font-weight:600;color:#fff}

/* ------------------------------------------------------------------ tabs */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:50}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 18px;display:flex;gap:26px;overflow-x:auto}
.tab{padding:14px 2px 12px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;
  white-space:nowrap}
.tab.on{color:var(--red);font-weight:600;border-bottom-color:var(--red)}
.tab .pill{display:inline-block;margin-left:6px;background:var(--red);color:#fff;font-size:11px;
  font-family:var(--mono);border-radius:999px;padding:1px 6px;vertical-align:1px}

/* --------------------------------------------------------------- sidebar */
.scrim{position:fixed;inset:0;background:rgba(27,18,20,.5);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:302px;max-width:86vw;background:#fff;z-index:90;
  transform:translateX(-102%);transition:transform .2s ease;display:flex;flex-direction:column;
  border-right:1px solid var(--line)}
.drawer.on{transform:none}
.dw-top{padding:16px 16px 14px;display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid var(--line)}
.dw-logo{width:34px;height:34px;border:1px solid var(--red);color:var(--red);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;flex:none}
.dw-top h2{margin:0;font-family:var(--serif);font-size:15.5px;color:var(--red);font-weight:600}
.dw-top p{margin:1px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
.dw-x{margin-left:auto;font-size:19px;color:var(--muted);line-height:1;padding:2px 4px}
.dw-body{flex:1;overflow:auto;padding:14px 0;display:flex;flex-direction:column;min-height:0}
.dw-grp{padding:12px 18px 6px;font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.dw-i{display:flex;align-items:center;gap:8px;padding:11px 18px;color:var(--red);font-size:14.5px;
  border-left:3px solid transparent;width:100%;text-align:left}
.dw-i:hover{background:#FBF5F5}
.dw-i.on{background:var(--red-l);border-left-color:var(--red);font-weight:600}
.dw-i .pill{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-family:var(--mono);
  border-radius:999px;padding:1px 7px}
.dw-admin{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;flex:none}
/* "จัดการผู้ใช้" อยู่ท้ายสุดของแถบเสมอ พร้อมเส้นคั่นแยกส่วนผู้ดูแลระบบ */
.tabs-in .tab-end{border-left:1px solid var(--line);padding-left:26px;margin-left:4px}
.dw-foot{border-top:1px solid var(--line);padding:14px 18px 16px}
.dw-foot .u{font-size:14px;font-weight:600}
.dw-foot .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dw-foot button{margin-top:11px;width:100%;border:1px solid var(--red);color:var(--red);
  border-radius:var(--r);padding:9px;font-size:14px}
.dw-foot button:hover{background:var(--red-l)}

/* ------------------------------------------------------------------ page */
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.card-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.09em;color:var(--muted);margin:0 0 3px}
.card h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600}
.card .sub{margin:5px 0 0;font-size:13px;color:var(--muted)}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

/* error box */
.errbox{border:1px solid var(--red);border-left:4px solid var(--red);background:var(--red-l);
  border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.errbox h3{margin:0 0 8px;font-family:var(--serif);font-size:16.5px;color:var(--red)}
.errbox ol{margin:8px 0 0;padding-left:20px}
.errbox li{margin:4px 0;font-size:13.5px}
.errbox code{font-family:var(--mono);font-size:12.5px;background:#fff;border:1px solid var(--line-2);
  border-radius:2px;padding:1px 5px}
.errbox .msg{font-size:13.5px}
.errbox .tail{margin:10px 0 0;font-size:13px;color:var(--red-d)}

/* overview bar */
.ovbar{display:flex;height:34px;border-radius:2px;overflow:hidden;border:1px solid var(--line-2);margin-top:14px}
.ovbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);
  font-size:13px;min-width:0}
.ovbar .g{background:var(--green)} .ovbar .r{background:var(--red)}

/* registry */
.reg-ctl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:120px}
.fld label{font-size:12.5px;color:var(--muted)}
.fld select,.fld input{border:1px solid var(--line-2);border-radius:var(--r);padding:9px 10px;
  background:#fff;font-size:14px;min-height:40px}
.reg-note{font-size:13px;color:var(--muted);padding-bottom:10px}
.reg-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{position:relative;width:46px;height:44px;border-radius:var(--r);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:#fff}
.chip.g{background:var(--green)} .chip.r{background:var(--red)}
.chip.p{background:#EFEAEA;color:var(--gray);border-color:var(--line-2)}
.chip .ck{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35)}
.chip.p .ck{color:var(--green);text-shadow:none}
.reg-hint{margin:16px 0 0;font-size:13px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.25;margin-top:2px}
.kpi .v small{font-size:16px;color:var(--muted)}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.g .v{color:var(--green)} .kpi.r .v{color:var(--red)}

.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols2 > .card{margin-bottom:0}

/* proportion list */
.plist{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.prow .t{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;margin-bottom:4px}
.prow .t b{font-family:var(--mono);font-weight:500;color:var(--muted)}
.ptrack{height:9px;background:#EFE9E9;border-radius:2px;overflow:hidden;display:flex}
.ptrack i{display:block;height:100%}
.ptrack i.g{background:var(--green)}
.ptrack i.r{background:var(--red)}
.prow .rt{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.prow .rt b{font-family:var(--mono);font-weight:600}
.prow .rt b.g{color:var(--green)} .prow .rt b.r{color:var(--red)}
.prow .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.rate{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rate-n{font-family:var(--mono);font-weight:600}
.rate-n.g{color:var(--green)} .rate-n.r{color:var(--red)}
.ptrack.mini{width:104px;height:6px}

/* table */
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.tbl th{text-align:right;font-weight:500;color:var(--muted);padding:9px 10px;
  border-bottom:1px solid var(--line-2);font-size:12.5px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;
  font-family:var(--mono);white-space:nowrap}
.tbl td:first-child{font-family:var(--sans)}
.tbl tr.sum td{font-weight:600;border-bottom:none}
.tbl-wrap{overflow-x:auto}

/* switch */
.sw{display:flex;align-items:center;gap:9px;margin-left:auto;font-size:13px;color:var(--muted)}
.sw-t{width:38px;height:21px;border-radius:999px;background:#DFD6D7;position:relative;transition:background .15s;flex:none}
.sw-t::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw.on .sw-t{background:var(--red)}
.sw.on .sw-t::after{transform:translateX(17px)}

/* ----------------------------------------------------------- case filters */
.filters{display:grid;grid-template-columns:1.6fr 1.1fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.filters .fld{min-width:0}
.my{display:flex;gap:8px}
.my select{flex:1;min-width:0}
.count{font-size:13.5px;color:var(--muted);margin-bottom:12px}

/* case row */
.crow{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gray);
  border-radius:var(--r);margin-bottom:12px}
.crow.g{border-left-color:var(--green)} .crow.r{border-left-color:var(--red)}

/* จุดสี AI บนแถวเคส — คนละจุดกับขอบซ้าย (ขอบซ้าย = ผลของอาจารย์แพทย์เท่านั้น) */
.aidot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;
  border:1px solid var(--line-2);border-radius:2px;padding:1px 7px;color:var(--muted);margin-left:9px}
.aidot i{width:8px;height:8px;border-radius:50%;background:var(--gray);display:block;flex:none}
.aidot.g{border-color:var(--green);color:var(--green)}  .aidot.g i{background:var(--green)}
.aidot.r{border-color:var(--red);color:var(--red)}      .aidot.r i{background:var(--red)}
.aidot.busy{border-color:var(--orange);color:#8E4A11}   .aidot.busy i{background:var(--orange);animation:aipulse 1s ease-in-out infinite}
@keyframes aipulse{0%,100%{opacity:1}50%{opacity:.2}}

/* แถบสถานะ AI เหนือรายการเคส */
.aibar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;font-size:13.5px}
.aibar .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aibar .top .ttl{font-weight:600}
.aibar .top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aibar button{border:1px solid var(--line-2);border-radius:var(--r);padding:5px 12px;font-size:13px;color:var(--muted)}
.aibar button:hover{border-color:var(--red);color:var(--red)}
.aibar .track{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.aibar .track i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.aibar .lg{margin-top:9px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.aibar .lg span{display:inline-flex;align-items:center;gap:5px}
.aibar .lg i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
.aibar .msg{margin-top:9px;font-size:12.5px;border-radius:var(--r);padding:8px 11px}
.aibar .msg.warn{color:#8E4A11;background:#FDF4EC;border:1px solid var(--orange)}
.aibar .msg.err{color:var(--red-d);background:var(--red-l);border:1px solid var(--red)}
.ainote{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.crow-b{padding:15px 18px}
.crow-b:hover{background:#FEFCFC}
.pt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-bottom:9px;
  border-bottom:1px dashed var(--line-2)}
.pt .nm{font-weight:700;font-size:15px}
.pt .tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);
  border-radius:2px;padding:1px 7px}
.pt .no{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta{margin-top:9px;font-size:12.5px;color:var(--muted)}
.meta span{margin-right:14px;white-space:nowrap}
.drug{margin-top:9px;font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.45;
  word-break:break-word}
.note{margin-top:10px;font-size:13.5px}
.note .lb{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);
  display:block;margin-bottom:2px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow-cf{border-top:1px dashed var(--line-2);padding:13px 18px 15px}

/* confirm box */
.cbox{border-radius:var(--r);padding:12px 14px;font-size:14px;width:100%;text-align:left;display:block}
.cbox.wait{border:1px solid var(--orange);background:#FDF4EC;color:#8E4A11}
.cbox.wait.can:hover{background:#FBEBDD}
.cbox.g{border:1px solid var(--green);background:#EEF5F2;color:#134C38}
.cbox.r{border:1px solid var(--red);background:var(--red-l);color:var(--red-d)}
.cbox .hd{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:600}
.cbox .who{margin-top:5px;font-size:12.5px;opacity:.85}
.cbox .cm{margin-top:7px;font-size:13.5px;line-height:1.5}
.cform{border:1px solid var(--orange);background:#FDF9F5;border-radius:var(--r);padding:13px 14px}
.cform .row{display:flex;gap:10px;flex-wrap:wrap}
.cform select{flex:1;min-width:170px;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 10px;background:#fff}
.cform input[type=text]{flex:2;min-width:200px;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 10px}
.cform .go{background:var(--red);color:#fff;border-radius:var(--r);padding:9px 20px;font-size:14px}
.cform .go[disabled]{opacity:.45;cursor:not-allowed}
.cform .cancel{color:var(--muted);font-size:13px;padding:9px 6px}
.cform .err{color:var(--red);font-size:13px;margin-top:8px}

/* ------------------------------------------------------------- slideover */
.so{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:100vw;background:var(--bg);z-index:90;
  transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
.so.on{transform:none}
.so-h{background:var(--red-d);color:#fff;padding:15px 20px;display:flex;align-items:center;gap:12px}
.so-h h2{margin:0;font-family:var(--serif);font-size:17px;font-weight:600}
.so-h .x{margin-left:auto;color:#fff;font-size:22px;line-height:1;padding:2px 6px}
.so-b{flex:1;overflow:auto;padding:18px}
.verdict{border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.verdict.g{border:1px solid var(--green);background:#EEF5F2}
.verdict.r{border:1px solid var(--red);background:var(--red-l)}
.verdict.p{border:1px solid var(--line-2);background:#F3EFEF}
.verdict .final{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.verdict .big{font-family:var(--serif);font-size:19px;font-weight:600}
.verdict.g .big{color:var(--green)} .verdict.r .big{color:var(--red)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:14px;margin-top:12px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;word-break:break-word}
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.flag{border:1px solid var(--line-2);border-radius:var(--r);padding:5px 10px;font-size:12.5px;color:var(--muted)}
.flag.on{border-color:var(--red);background:var(--red-l);color:var(--red-d);font-weight:600}
.grade{font-family:var(--mono);font-weight:700;background:var(--red);color:#fff;border-radius:2px;
  padding:1px 7px;margin:0 3px;letter-spacing:.02em}
.grade.na{background:var(--orange);color:#fff}
.flag.on:has(.grade.na){border-color:var(--orange);background:#FDF4EC;color:#8E4A11}
.full{white-space:pre-wrap;font-size:14px;line-height:1.6}
.danger{border:1px solid var(--red);color:var(--red);border-radius:var(--r);padding:9px 16px;font-size:13.5px;margin-top:12px}
.danger:hover{background:var(--red-l)}

/* ----------------------------------------------------------------- modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(27,18,20,.55)}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:var(--r);width:100%;max-width:420px;padding:24px;max-height:92vh;overflow:auto}
.mbox h2{margin:0 0 4px;font-family:var(--serif);font-size:19px}
.mbox p.s{margin:0 0 16px;font-size:13px;color:var(--muted)}
.mbox .fld{margin-bottom:12px}
.mbox input,.mbox select{width:100%;border:1px solid var(--line-2);border-radius:var(--r);padding:10px}
.mbox .go{width:100%;background:var(--red);color:#fff;border-radius:var(--r);padding:11px;font-size:15px;margin-top:6px}
.mbox .alt{margin-top:14px;font-size:13.5px;text-align:center;color:var(--muted)}
.mbox .alt button{color:var(--red);font-weight:600}
.mbox .err{color:var(--red);font-size:13.5px;margin-top:10px}
.mbox .ok{color:var(--green);font-size:13.5px;margin-top:10px}
.mbox .close{position:absolute}

/* users page */

<script>
"use strict";

/* ============================================================== constants */

var API = '/api/rdu';
/** ป้ายเวอร์ชัน — ใช้ตรวจว่าหน้าเว็บที่เปิดอยู่เป็นไฟล์ล่าสุดจริงหรือไม่ (แสดงท้ายหน้า) */
var BUILD = '2026-08-28d · drug-price';
/** ดึงข้อมูลจาก Google Sheets ซ้ำทุกกี่มิลลิวินาที (60000 = 1 นาที) */
var REFRESH_MS = 60000;
var TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                 'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var FLAG_LABELS = [
  ['tear',       'แผลฝีเย็บฉีกขาด (Perineal tear)'],
  ['hemorrhage', 'ตกเลือดหลังคลอด (Postpartum hemorrhage)'],
  ['balloon',    'ใส่บอลลูนห้ามเลือด (Balloon tamponade)'],
  ['clot',       'ก้อนเลือดคั่ง / ล้วงรก'],
  ['syphilis',   'ซิฟิลิส (Syphilis)'],
  ['tubal',      'ทำหมันหลังคลอด (Postpartum Sterilization)']
];
/** ค่าที่ถือว่า "ไม่ระบุระดับ" ในคอลัมน์ tear */
function isNA(v) {
  var s = String(v || '').trim().toLowerCase();
  return s === 'n/a' || s === 'na' || s === '-' || s === 'ไม่ระบุ';
}

var S = {
  loading: true,
  error: null,
  cases: [],
  confirmations: {},
  session: null,          // {token, user}
  pendingRequests: 0,
  page: 'dashboard',
  showDoctorNames: false,
  users: [],
  detailNo: null,
  dash: { year: '', month: '' },
  /* ราคายา — อ่านจากแท็บ Drugs ในชีตเดียวกัน */
  drugs: [],
  dq: '',                  // คำค้นในหน้าราคายา
  df: 'all',               // ตัวกรอง: all | on | off
  soMode: 'case',          // แถบด้านข้างกำลังแสดงอะไร: case | drug
  drugEdit: null,          // แถวยาที่กำลังแก้ (null = เพิ่มใหม่)
  lastSync: null,          // เวลาที่ดึงข้อมูลจากชีตสำเร็จครั้งล่าสุด
  syncErr: '',             // ข้อความเมื่อดึงซ้ำไม่สำเร็จ (ไม่ล้างข้อมูลเดิมทิ้ง)
  syncing: false,
  f: { q: '', month: '', year: '', doctor: '', drug: '', result: '', confirmed: '' },
  /* ผู้ช่วยอ่าน guideline (AI) — แยกขาดจากสถานะเคส ไม่มีผลต่อ statusOf() */
  ai: {
    by: {},            // case_no -> {opinion, confidence, summary, model, at, by}
    health: 'unknown', // unknown | ok | down
    healthMsg: '',
    store: 'none',     // sheet | local | none
    storeMsg: '',
    running: false,
    stopped: false,
    busyNo: null,
    done: 0,
    total: 0,
    fail: 0,
    lastErr: ''
  }
};

/* ================================================================ helpers */

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg) {
  var t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('on'); }, 2600);
}
function isOn(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
  return s === '1' || s === 'true' || s === 'yes' || s === 'y' || s === 'ใช่';
}
function pct(a, b) { return b > 0 ? (a * 100 / b) : 0; }
function fmtPct(x) { return (Math.round(x * 10) / 10).toFixed(1) + '%'; }

/** "1/4/2569" -> {d,m,y}  (m = 1..12, y = พ.ศ.) */
function parseThaiDate(str) {
  var s = String(str || '').trim();
  if (!s) return null;
  var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return { d: +m[1], m: +m[2], y: +m[3] };
  var iso = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (iso) return { d: +iso[3], m: +iso[2], y: +iso[1] < 2400 ? +iso[1] + 543 : +iso[1] };
  return null;
}

/** ชื่อยาสำหรับ "จัดกลุ่ม/ตัวกรอง" เท่านั้น — การแสดงผลในแถวใช้ข้อความเต็มจากชีตเสมอ */
function drugKey(text) {
  var s = String(text || '').trim();
  if (!s) return '(ไม่ระบุยา)';
  var stop = /^(CAP|CAPS|CAPSULE|TAB|TABS|TABLET|INJ|INJECTION|SYR|SYRUP|SUSP|SOLN|SOL|VIAL|AMP|IV|IM|PO|MG|GM|G|ML|MU)\.?$/i;
  var parts = s.split(/\s+/), out = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (/\d/.test(p) || stop.test(p) || /^\(/.test(p)) break;
    out.push(p);
  }
  return (out.join(' ') || parts[0]).replace(/[.,;]+$/, '').toUpperCase();
}

function indicationsOf(c) {
  var out = [];
  var tear = String(c.tear || '').trim();
  if (tear && tear !== '0') {
    out.push(isNA(tear)
      ? 'แผลฝีเย็บฉีกขาด ไม่ระบุระดับ (Perineal tear, grade N/A)'
      : 'แผลฝีเย็บฉีกขาดระดับ ' + tear + ' (Perineal tear grade ' + tear + ')');
  }
  if (isOn(c.tubal)) out.push('ทำหมันหลังคลอด (Postpartum Sterilization)');
  if (isOn(c.balloon)) out.push('ใส่บอลลูนห้ามเลือด (Balloon tamponade)');
  if (isOn(c.hemorrhage)) out.push('ตกเลือดหลังคลอด (Postpartum hemorrhage)');
  if (isOn(c.clot)) out.push('ก้อนเลือดคั่ง / ล้วงรก');
  if (isOn(c.syphilis)) out.push('ซิฟิลิส (Syphilis)');
  if (!out.length) out.push('ไม่พบข้อบ่งชี้ที่บันทึกไว้ในเวชระเบียน');
  return out;
}

/* ------------------------------------------------ ราคายาและมูลค่าที่เลี่ยงได้ */

var DRUG_FORMS = ['CAP','CAPS','CAPSULE','TAB','TABS','TABLET','INJ','INJECTION','SYR','SYRUP',
                  'SUSP','SOLN','SOL','VIAL','AMP','AMPULE','SUPP','CREAM','OINT','GEL','DROP','POWDER'];
/* หน่วยนับใช้ภาษาอังกฤษทั้งหมด ให้ตรงกับที่เขียนในคำสั่งยา */
var UNIT_OPTIONS = ['tablet','capsule','vial','ampule','bottle','tube','sachet','syringe','ml','unit'];
/* หน่วยความแรงของยา — เลขกับหน่วยแยกช่องกัน */
var STRENGTH_UNITS = ['MG','GM','G','MCG','ML','IU','MU','%'];
/* แถวเก่าที่เคยกรอกเป็นภาษาไทยไว้ แปลงให้อัตโนมัติตอนเปิดแก้ไข */
var UNIT_TH2EN = { 'เม็ด':'tablet', 'แคปซูล':'capsule', 'ขวด':'vial', 'ไวแอล':'vial',
                   'หลอด':'tube', 'ซอง':'sachet', 'หน่วย':'unit', 'มล.':'ml', 'แอมพูล':'ampule' };
function unitEn(u) {
  var v = String(u || '').trim();
  return UNIT_TH2EN[v] || v;
}
/** แยก "300 MG" เป็น { num:'300', unit:'MG' } */
function splitStrength(s) {
  var m = String(s || '').trim().match(/^([\d.]+)\s*(.*)$/);
  if (!m) return { num: '', unit: 'MG' };
  return { num: m[1], unit: (m[2] || 'MG').toUpperCase() };
}
/** แยก "20.50" เป็น { baht:'20', satang:'50' } */
function splitPrice(p) {
  var raw = String(p === null || p === undefined ? '' : p).replace(/,/g, '').trim();
  if (raw === '') return { baht: '', satang: '' };      // ฟอร์มเปล่าต้องว่างจริง ๆ ไม่ใช่ 0.00
  var n = Number(raw);
  if (!(n >= 0)) return { baht: '', satang: '' };
  var fixed = n.toFixed(2).split('.');
  return { baht: fixed[0], satang: fixed[1] };
}

function normKey(s) { return String(s || '').toUpperCase().replace(/[\s.\-_]/g, ''); }
function normForm(f) {
  var s = String(f || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!s) return '';
  if (s.indexOf('CAP') === 0) return 'CAP';
  if (s.indexOf('TAB') === 0) return 'TAB';
  if (s.indexOf('INJ') === 0 || s.indexOf('VIAL') === 0 || s.indexOf('AMP') === 0) return 'INJ';
  if (s.indexOf('SYR') === 0 || s.indexOf('SUSP') === 0 || s.indexOf('SOL') === 0) return 'SYR';
  return s;
}
function normStrength(s) {
  return String(s || '').toUpperCase().replace(/\s+/g, '').replace(/GRAM(S)?$/, 'G').replace(/GM$/, 'G');
}

/** แยกข้อความคำสั่งยา — ตรรกะเดียวกับฝั่ง Apps Script เป๊ะ ๆ */
function parseDrugText(text) {
  var s = String(text || '').trim();
  var out = { generic: '', form: '', strength: '', qty: 0, raw: s };
  if (!s) return out;
  var q = s.match(/\((\d+(?:\.\d+)?)\)[^()]*$/);
  if (q) out.qty = Number(q[1]);
  var m = s.match(/(\d+(?:\.\d+)?)\s*(MCG|MG|GM|G|ML|IU|MU|%)\b/i);
  if (m) out.strength = m[1] + ' ' + m[2].toUpperCase();
  var parts = s.split(/\s+/), i, w, wu, g = [];
  for (i = 0; i < parts.length; i++) {
    wu = parts[i].replace(/[.,;:]+$/, '').toUpperCase();
    if (DRUG_FORMS.indexOf(wu) >= 0) { out.form = wu; break; }
  }
  for (i = 0; i < parts.length; i++) {
    w = parts[i]; wu = w.replace(/[.,;:]+$/, '').toUpperCase();
    if (/\d/.test(w) || DRUG_FORMS.indexOf(wu) >= 0 || w.charAt(0) === '(') break;
    g.push(wu);
  }
  out.generic = g.join(' ').replace(/[.,;:]+$/, '');
  return out;
}

function findDrugRow(p) {
  var gen = normKey(p.generic);
  if (!gen) return null;
  var cand = S.drugs.filter(function (d) { return isOn(d.active) && normKey(d.generic) === gen; });
  if (!cand.length) return null;
  if (p.form) {
    var f = normForm(p.form);
    var bf = cand.filter(function (d) { return normForm(d.form) === f; });
    if (bf.length) cand = bf;
  }
  if (p.strength) {
    var st = normStrength(p.strength);
    var bs = cand.filter(function (d) { return normStrength(d.strength) === st; });
    if (bs.length) cand = bs;
  }
  if (cand.length > 1) {
    cand = cand.slice().sort(function (a, b) {
      return String(b.effective_from || '').localeCompare(String(a.effective_from || ''));
    });
  }
  return cand[0] || null;
}

/** ค่ายาของเคสตามราคา "ปัจจุบัน" ในตาราง Drugs (ใช้เป็นตัวหารและตัวประมาณการเท่านั้น) */
function priceNow(c) {
  var p = parseDrugText(c.drug);
  if (!p.generic) return { matched: false, parsed: p, reason: 'อ่านชื่อยาจากคำสั่งยาไม่ได้' };
  var row = findDrugRow(p);
  if (!row) return { matched: false, parsed: p, reason: 'ยังไม่มีราคาของ ' + p.generic + ' ในตารางราคายา' };
  var price = Number(String(row.price_per_unit || '').replace(/,/g, ''));
  if (!(price >= 0)) return { matched: false, parsed: p, reason: 'ราคาของ ' + p.generic + ' ไม่ใช่ตัวเลข' };
  if (!(p.qty > 0)) return { matched: false, parsed: p, price: price, reason: 'คำสั่งยาไม่มีจำนวนที่จ่ายในวงเล็บ' };
  return { matched: true, parsed: p, drug: row, price: price, qty: p.qty,
           amount: Math.round(price * p.qty * 100) / 100 };
}

/**
 * มูลค่าที่เลี่ยงได้ของเคสหนึ่ง = ค่ายาที่ "ล็อกไว้" ตอนอาจารย์แพทย์ยืนยันว่าไม่สมเหตุผล
 * ผลของ AI ไม่นับเป็นเงิน และการแก้ราคาในตารางภายหลังไม่ทำให้ตัวเลขนี้เปลี่ยน
 */
function savedAmount(c) {
  var k = confOf(c);
  if (!k || k.status !== 'irrational') return 0;
  var n = Number(String(k.amount || '').replace(/,/g, ''));
  return n > 0 ? n : 0;
}

function baht(n) {
  return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/** สรุปตัวเลขทั้งหมดของหน้าราคายา จากเคสชุดที่ส่งเข้ามา */
function priceSummary(list) {
  var out = {
    saved: 0, savedCases: 0,          // ยืนยันว่าไม่สมเหตุผล + จับคู่ราคาได้
    unmatched: [],                    // ยืนยันว่าไม่สมเหตุผล แต่จับคู่ราคาไม่ได้
    fixable: 0, fixableAmt: 0,        // ยืนยันก่อนมีราคา — กดคิดเงินย้อนหลังได้เลย
    pendingAmt: 0, pendingCases: 0,   // AI ว่าไม่สมเหตุผล แต่ยังไม่มีใครยืนยัน
    totalAmt: 0, totalCases: 0,       // ค่ายารวมทุกเคสตามราคาปัจจุบัน (ตัวหาร)
    byDrug: {}
  };
  list.forEach(function (c) {
    var live = priceNow(c);
    var k = confOf(c);
    var locked = savedAmount(c);

    /* ตัวหาร = ค่ายารวมทุกเคสที่คิดราคาได้
       เคสที่ยืนยันแล้วใช้ราคาที่ล็อกไว้ เคสอื่นใช้ราคาปัจจุบัน
       ทำแบบนี้ตัวเศษจึงเป็นส่วนหนึ่งของตัวหารเสมอ สัดส่วนไม่มีวันเกิน 100% */
    if (locked > 0) { out.totalAmt += locked; out.totalCases++; }
    else if (live.matched) { out.totalAmt += live.amount; out.totalCases++; }

    if (k && k.status === 'irrational') {
      var amt = locked;
      if (amt > 0) {
        out.saved += amt; out.savedCases++;
        var key = live.parsed.generic || '(ไม่ทราบชื่อยา)';
        var g = out.byDrug[key] || (out.byDrug[key] = { cases: 0, amount: 0 });
        g.cases++; g.amount += amt;
      } else if (live.matched) {
        /* ตอนนี้มีราคาในตารางแล้ว แต่ตอนกดยืนยันยังไม่มี ค่ายาเลยถูกล็อกเป็นค่าว่าง
           แก้ได้ด้วยปุ่ม "คิดเงินย้อนหลัง" ไม่ต้องยกเลิกการยืนยันแล้วยืนยันใหม่ */
        out.fixable++;
        out.fixableAmt += live.amount;
        out.unmatched.push({ c: c, fixable: true,
          reason: 'ยืนยันไว้ก่อนที่จะมีราคาในตาราง — ตอนนี้คิดได้ ' + baht(live.amount) + ' บาทแล้ว' });
      } else {
        out.unmatched.push({ c: c, fixable: false, reason: live.reason || 'จับคู่ราคาไม่ได้' });
      }
    } else if (!k && aiStatusOf(c) === 'irrational') {
      out.pendingCases++;
      if (live.matched) out.pendingAmt += live.amount;
    }
  });
  out.saved = Math.round(out.saved * 100) / 100;
  out.pendingAmt = Math.round(out.pendingAmt * 100) / 100;
  out.fixableAmt = Math.round(out.fixableAmt * 100) / 100;
  out.totalAmt = Math.round(out.totalAmt * 100) / 100;
  return out;
}

function confOf(c) { return S.confirmations[String(c.no).trim()] || null; }

/** ผล AI แปลงเป็นสถานะเคส — insufficient_data ไม่นับ ให้คงเป็นรอประเมิน */
function aiStatusOf(c) {
  var a = (typeof aiOf === 'function') ? aiOf(c) : null;
  if (!a) return null;
  if (a.opinion === 'appropriate') return 'rational';
  if (a.opinion === 'not_appropriate') return 'irrational';
  return null;
}

/**
 * สถานะของเคส = ผลอาจารย์แพทย์ถ้ามี ถ้ายังไม่มีก็ใช้ผล AI
 * ใช้ร่วมกันทั้ง KPI ทะเบียนเคส ตัวกรอง สถิติรายแพทย์ และแถบสีข้างแถว
 */
function statusOf(c) {
  var k = confOf(c);
  if (k) return k.status === 'rational' ? 'rational' : 'irrational';
  return aiStatusOf(c) || 'pending';
}
function statusClass(st) { return st === 'rational' ? 'g' : st === 'irrational' ? 'r' : 'p'; }
function statusText(st) {
  return st === 'rational' ? 'สมเหตุผล' : st === 'irrational' ? 'ไม่สมเหตุผล' : 'รอประเมิน';
}
function canConfirm() {
  return !!(S.session && (S.session.user.role === 'advisor' || S.session.user.role === 'admin'));
}
function isAdmin() { return !!(S.session && S.session.user.role === 'admin'); }

/** ชื่อแพทย์แบบไม่ระบุตัวตน */
function doctorLabel(name) {
  var n = String(name || '').trim() || '(ไม่ระบุ)';
  if (S.showDoctorNames) return n;
  var idx = doctorLabel._map[n];
  return idx ? 'แพทย์ ' + (idx < 10 ? '0' + idx : idx) : 'แพทย์ —';
}
doctorLabel._map = {};
function rebuildDoctorMap() {
  var names = [];
  S.cases.forEach(function (c) {
    var n = String(c.doctor || '').trim() || '(ไม่ระบุ)';
    if (names.indexOf(n) < 0) names.push(n);
  });
  names.sort(function (a, b) { return a.localeCompare(b, 'th'); });
  doctorLabel._map = {};
  names.forEach(function (n, i) { doctorLabel._map[n] = i + 1; });
}

/* ==================================================================== api */

function api(action, payload) {
  var body = Object.assign({ action: action }, payload || {});
  if (S.session && S.session.token && body.token === undefined) body.token = S.session.token;
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (res) {
    return res.text().then(function (txt) {
      var data = null;
      try { data = JSON.parse(txt); } catch (e) {
        throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (HTTP ' + res.status + '): ' +
                        String(txt).slice(0, 180));
      }
      if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    });
  }, function () {
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
  });
}

function loadData() {
  S.loading = true; S.error = null; render();
  return api('bootstrap', { token: '' }).then(function (d) {
    S.cases = (d.cases || []).slice();
    S.drugs = (d.drugs || []).slice();
    S.confirmations = {};
    (d.confirmations || []).forEach(function (r) {
      var k = String(r.case_no || '').trim();
      if (k) S.confirmations[k] = r;
    });
    S.cases.sort(function (a, b) { return (Number(a.no) || 0) - (Number(b.no) || 0); });
    rebuildDoctorMap();                 // ดัชนีตัวกรองสร้างหลังโหลดข้อมูลเสมอ
    S.lastSync = new Date(); S.syncErr = '';
    S.loading = false;
    render();
    aiInit();                           // โหลดผล AI ที่เคยบันทึกไว้ แล้วไล่ประเมินเคสที่ยังไม่มีผล
  }).catch(function (err) {
    S.loading = false;
    S.error = err.message || String(err);
    S.cases = []; S.confirmations = {};   // เชื่อมต่อไม่ได้ = ไม่แสดงเคสใด ๆ
    render();
  });
}

/* ------------------------------------------- ดึงข้อมูลซ้ำอัตโนมัติทุก 1 นาที */

/**
 * ดึงข้อมูลใหม่แบบไม่รบกวนหน้าจอ — ไม่ขึ้นสถานะกำลังโหลด ไม่ล้างข้อมูลเดิม
 * ถ้าดึงไม่สำเร็จจะคงข้อมูลเดิมไว้ แล้วบอกที่ท้ายหน้าว่าอัปเดตล่าสุดเมื่อไหร่
 */
function quietReload() {
  if (S.syncing) return Promise.resolve();
  S.syncing = true;
  var before = S.cases.length;

  return api('bootstrap', { token: '' }).then(function (d) {
    S.cases = (d.cases || []).slice();
    S.drugs = (d.drugs || []).slice();
    S.confirmations = {};
    (d.confirmations || []).forEach(function (r) {
      var k = String(r.case_no || '').trim();
      if (k) S.confirmations[k] = r;
    });
    S.cases.sort(function (a, b) { return (Number(a.no) || 0) - (Number(b.no) || 0); });
    rebuildDoctorMap();
    S.lastSync = new Date(); S.syncErr = ''; S.error = null;
    return aiLoadStored();                    // ดึงผล AI ล่าสุดจากชีตด้วย
  }).then(function () {
    var y = window.scrollY;
    render();
    aiPaintBar();
    S.cases.forEach(function (c) { aiPaintDot(aiKey(c)); });
    window.scrollTo(0, y);
    if (S.cases.length > before) toast('มีเคสใหม่ ' + (S.cases.length - before) + ' เคส');
    // มีเคสใหม่ที่ยังไม่มีผล AI → ให้ไล่ประเมินต่อทันที
    if (S.ai.health === 'ok' && !S.ai.running && aiPending().length) aiStart(false);
  }).catch(function (err) {
    S.syncErr = err.message || String(err);   // เก็บข้อมูลเดิมไว้ ไม่ล้างหน้าจอ
    updateFooter();
  }).then(function () { S.syncing = false; });
}

/** ข้ามการดึงซ้ำเมื่อจังหวะไม่เหมาะ เพื่อไม่ให้สิ่งที่ผู้ใช้กำลังทำค้างอยู่หาย */
function canAutoRefresh() {
  if (document.hidden) return false;                      // ไม่ได้ดูแท็บนี้อยู่
  if (S.syncing || S.loading) return false;
  if ($('modal').classList.contains('on')) return false;  // กล่องเข้าสู่ระบบ/สมัครเปิดอยู่
  if (S.page === 'users') return false;                   // หน้าจัดการผู้ใช้มีตัวโหลดของตัวเอง
  if (S.soMode === 'drug') return false;                  // กำลังกรอกฟอร์มราคายาอยู่

  // AI กำลังไล่ประเมิน — กันไว้ไม่เกิน 3 นาที เผื่อบริการ AI ค้างแล้วบล็อกถาวร
  if (S.ai.running && (Date.now() - (S.ai.startedAt || 0)) < 180000) return false;

  // กันเฉพาะตอนที่กำลังกรอกเหตุผลอยู่จริง ๆ (มีข้อความ หรือเคอร์เซอร์อยู่ในช่อง)
  var note = document.querySelector('[data-cf-note]');
  if (note && (String(note.value).trim() || document.activeElement === note)) return false;

  return true;
}

function startAutoRefresh() {
  clearInterval(startAutoRefresh._t);
  startAutoRefresh._t = setInterval(function () {
    if (canAutoRefresh()) quietReload();
  }, REFRESH_MS);

  // กลับมาที่แท็บนี้เมื่อไหร่ ดึงใหม่ทันทีโดยไม่ต้องรอครบนาที
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && canAutoRefresh()) quietReload();
  });
}

/* ================================================================ session */

function saveSession(s) {
  S.session = s;
  try {
    if (s) sessionStorage.setItem('rdu_session', JSON.stringify(s));
    else sessionStorage.removeItem('rdu_session');
  } catch (e) {}
  if (!s) { S.showDoctorNames = false; S.users = []; S.pendingRequests = 0; }
}

function restoreSession() {
  var raw = null;
  try { raw = sessionStorage.getItem('rdu_session'); } catch (e) {}
  if (!raw) return Promise.resolve();
  var s;
  try { s = JSON.parse(raw); } catch (e) { return Promise.resolve(); }
  S.session = s;
  return api('me', {}).then(function (d) {
    saveSession({ token: s.token, user: d.user });
    S.pendingRequests = d.pendingRequests || 0;
  }).catch(function () { saveSession(null); });
}

function logout() {
  saveSession(null);
  if (S.page === 'users') S.page = 'dashboard';
  render();
  toast('ออกจากระบบแล้ว');
}

function startPendingWatch() {
  clearInterval(startPendingWatch._t);
  startPendingWatch._t = setInterval(function () {
    if (!isAdmin()) return;
    api('pendingCount', {}).then(function (d) {
      if (d.pendingRequests !== S.pendingRequests) {
        S.pendingRequests = d.pendingRequests; render();
      }
    }).catch(function () {});
  }, 60000);
}

/* ============================================================== derived  */

function caseDate(c) { return parseThaiDate(c.admit); }

function yearOptions() {
  var ys = [];
  S.cases.forEach(function (c) {
    var d = caseDate(c);
    if (d && ys.indexOf(d.y) < 0) ys.push(d.y);
  });
  return ys.sort(function (a, b) { return b - a; });
}
function monthOptions(year) {
  var ms = [];
  S.cases.forEach(function (c) {
    var d = caseDate(c);
    if (!d) return;
    if (year && d.y !== +year) return;
    if (ms.indexOf(d.m) < 0) ms.push(d.m);
  });
  return ms.sort(function (a, b) { return a - b; });
}
function doctorOptions() {
  var ds = [];
  S.cases.forEach(function (c) {
    var n = String(c.doctor || '').trim() || '(ไม่ระบุ)';
    if (ds.indexOf(n) < 0) ds.push(n);
  });
  return ds.sort(function (a, b) { return a.localeCompare(b, 'th'); });
}
function drugOptions() {
  var ds = [];
  S.cases.forEach(function (c) {
    var k = drugKey(c.drug);
    if (ds.indexOf(k) < 0) ds.push(k);
  });
  return ds.sort();
}

function inPeriod(c, year, month) {
  if (!year && !month) return true;
  var d = caseDate(c);
  if (!d) return false;
  if (year && d.y !== +year) return false;
  if (month && d.m !== +month) return false;
  return true;
}

function filteredCases() {
  var q = S.f.q.trim().toLowerCase();
  return S.cases.filter(function (c) {
    if (!inPeriod(c, S.f.year, S.f.month)) return false;
    if (S.f.doctor && (String(c.doctor || '').trim() || '(ไม่ระบุ)') !== S.f.doctor) return false;
    if (S.f.drug && drugKey(c.drug) !== S.f.drug) return false;
    var st = statusOf(c);
    if (S.f.result && st !== S.f.result) return false;
    if (S.f.confirmed === 'yes' && st === 'pending') return false;
    if (S.f.confirmed === 'no' && st !== 'pending') return false;
    if (q) {
      var hay = [c.no, c.hn, c.an, c.patientName, c.icd10, c.icd10Other, c.icd9,
                 c.drug, c.doctorOrder, c.nurseNote, S.showDoctorNames ? c.doctor : '']
                .join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function tally(list) {
  var t = { total: list.length, rational: 0, irrational: 0, pending: 0, confirmed: 0 };
  list.forEach(function (c) {
    var st = statusOf(c);
    if (st === 'rational') t.rational++;
    else if (st === 'irrational') t.irrational++;
    else t.pending++;
    if (confOf(c)) t.confirmed++;          // อาจารย์แพทย์ยืนยันแล้วเท่านั้น
  });
  t.done = t.rational + t.irrational;
  return t;
}

/**
 * เมนูทั้งระบบอยู่ที่เดียว ใช้ร่วมกันทั้งแถบบนและแถบข้าง
 * รายการที่ pinEnd: true (เช่น "จัดการผู้ใช้") ถูกดันไปท้ายสุดเสมอ
 * เพิ่มเมนูใหม่ให้ push เข้า items ตรงจุดที่คอมเมนต์ไว้
 */
function navItems() {
  var pending = S.cases.filter(function (c) { return statusOf(c) === 'pending'; }).length;
  var items = [
    { id: 'dashboard', label: 'แดชบอร์ด',  group: 'ภาพรวม',   badge: 0 },
    { id: 'cases',     label: 'เคสทั้งหมด', group: 'ข้อมูลเคส', badge: pending },
    { id: 'drugs',     label: 'ราคายา',     group: 'ข้อมูลเคส', badge: 0 }
    /* ── เพิ่มเมนูใหม่ตรงนี้ ── */
  ];
  if (isAdmin()) {
    items.push({ id: 'users', label: 'จัดการผู้ใช้', group: 'ผู้ดูแลระบบ',
                 badge: S.pendingRequests, pinEnd: true });
  }
  return items.sort(function (a, b) { return (a.pinEnd ? 1 : 0) - (b.pinEnd ? 1 : 0); });
}

function renderTabs() {
  $('tabs').innerHTML = navItems().map(function (it) {
    return '<button class="tab' + (S.page === it.id ? ' on' : '') +
      (it.pinEnd ? ' tab-end' : '') + '" data-page="' + it.id + '">' +
      esc(it.label) + (it.badge ? '<span class="pill">' + it.badge + '</span>' : '') + '</button>';
  }).join('');
}

function renderDrawer() {
  var items = navItems();

  function block(list) {
    var out = '', lastGroup = null;
    list.forEach(function (it) {
      if (it.group !== lastGroup) { out += '<div class="dw-grp">' + esc(it.group) + '</div>'; lastGroup = it.group; }
      out += '<button class="dw-i' + (S.page === it.id ? ' on' : '') + '" data-page="' + it.id + '">' +
        esc(it.label) + (it.badge ? '<span class="pill">' + it.badge + '</span>' : '') + '</button>';
    });
    return out;
  }

  var pinned = items.filter(function (it) { return it.pinEnd; });
  var html = block(items.filter(function (it) { return !it.pinEnd; }));
  if (pinned.length) html += '<div class="dw-admin">' + block(pinned) + '</div>';
  $('dwBody').innerHTML = html;

  var t = tally(S.cases);
  if (S.session) {
    $('dwFoot').innerHTML =
      '<div class="u">' + esc(S.session.user.name || S.session.user.username) + '</div>' +
      '<div class="s">อาจารย์แพทย์ยืนยันแล้ว ' + t.confirmed + ' จาก ' + t.total + ' เคส</div>' +
      '<button data-act="logout">ออกจากระบบ</button>';
  } else {
    $('dwFoot').innerHTML =
      '<div class="u">ยังไม่ได้เข้าสู่ระบบ</div>' +
      '<div class="s">เข้าสู่ระบบเพื่อยืนยันผลประเมิน</div>' +
      '<button data-act="login">เข้าสู่ระบบ</button>';
  }
}

function viewFooter() {
  var t = tally(S.cases);
  return '<div class="foot">ข้อมูลเคสทั้งหมดอ่านจาก Google Sheets โดยตรงทุกครั้งที่เปิดหน้า ' +
    '· ผลเบื้องต้นประเมินโดยระบบตามแนวทางที่นำเข้าไว้ อาจารย์แพทย์ยืนยันทับได้ทุกเคส และผลของอาจารย์แพทย์ถือเป็นที่สุด ' +
    '· อาจารย์แพทย์ยืนยันแล้ว ' + t.confirmed + ' จาก ' + t.total + ' เคส' +
    '<span class="build"><button data-act="syncNow" style="font:inherit;color:inherit;' +
    'text-decoration:underline;text-underline-offset:2px;cursor:pointer">' + syncLine() +

/** บรรทัดบอกสถานะการดึงข้อมูลอัตโนมัติ */
function syncLine() {
  if (!S.lastSync) return 'ยังไม่ได้ดึงข้อมูล';
  var t = S.lastSync;
  var hh = ('0' + t.getHours()).slice(-2), mm = ('0' + t.getMinutes()).slice(-2);
  var base = 'ดึงข้อมูลจากชีตอัตโนมัติทุก 1 นาที · ล่าสุด ' + hh + ':' + mm + ' น.';
  return S.syncErr ? base + ' · ดึงรอบล่าสุดไม่สำเร็จ (' + esc(S.syncErr) + ') กำลังลองใหม่' : base;
}

function errorBox() {
  if (!S.error) return '';
  var origin = location.origin || '';
  return '<div class="errbox">' +
    '<h3>ยังเชื่อมต่อฐานข้อมูลไม่ได้</h3>' +
    '<div class="msg">ข้อความจากระบบ: <code>' + esc(S.error) + '</code></div>' +
    '<ol>' +
    '<li>เปิด <code>' + esc(origin) + '/api/rdu</code> ในแท็บใหม่ — ต้องได้ JSON ที่มีคำว่า "รองรับเฉพาะ POST" ถ้าได้ 404 แปลว่าไฟล์ <code>api/rdu.js</code> ไม่ได้ขึ้นไปบน Vercel</li>' +
    '<li>ตรวจ Environment Variables ใน Vercel ว่ามี <code>APPS_SCRIPT_URL</code> และ <code>SHARED_SECRET</code> ครบ และติ๊กครบทั้ง 3 environment</li>' +
    '<li>หลังตั้งค่าแล้วต้องกด <b>Redeploy</b> หนึ่งครั้งเสมอ</li>' +
    '<li>เปิด URL ของ Apps Script ที่ลงท้าย <code>/exec</code> ตรง ๆ — ต้องเห็นข้อความ "RDU API พร้อมใช้งาน"</li>' +
    '<li>ค่า <code>SHARED_SECRET</code> ใน Vercel ต้องตรงกับใน Script Properties ทุกตัวอักษร</li>' +
    '<li>แก้โค้ด Apps Script แล้วต้อง Deploy เวอร์ชันใหม่ทุกครั้ง</li>' +
    '</ol>' +
    '<p class="tail">ระบบจะไม่แสดงข้อมูลใด ๆ จนกว่าจะเชื่อมต่อชีตได้ เพื่อไม่ให้เข้าใจผิดว่าเป็นข้อมูลจริง</p>' +
    '</div>';
}

/* ======================================================= render: dashboard */

function viewDashboard() {
  if (S.loading) return errorBox() + '<div class="card"><div class="empty">กำลังโหลดข้อมูลจาก Google Sheets…</div></div>';

  var t = tally(S.cases);
  var html = errorBox();

  var years = yearOptions();
  var months = monthOptions(S.dash.year);
  var periodCases = S.cases.filter(function (c) { return inPeriod(c, S.dash.year, S.dash.month); });
  var pt = tally(periodCases);
  var ps = priceSummary(periodCases);          // มูลค่าที่เลี่ยงได้ของช่วงเวลาที่เลือก

  /* --- ภาพรวม: สัดส่วนความสมเหตุผล + มูลค่าที่เลี่ยงได้ ของช่วงเวลาเดียวกัน --- */
  html += '<div class="card"><div class="card-h"><div>' +
    '<p class="eyebrow">ภาพรวม · ' + esc(periodLabel()) + '</p>' +
    '<h3 style="font-size:15px;font-weight:500;color:var(--muted);font-family:var(--sans)">' +
    'สัดส่วนจากเคสที่มีผลแล้ว — ผลอาจารย์แพทย์มาก่อน ถ้ายังไม่มีใช้ผลเบื้องต้นจาก AI</h3></div>' +
    '<div class="legend">' +
    '<span><i style="background:var(--green)"></i>สมเหตุผล</span>' +
    '<span><i style="background:var(--red)"></i>ไม่สมเหตุผล</span></div></div>' +
    periodPicker(years, months, pt);

  if (pt.done === 0) {
    html += '<div class="empty" style="background:var(--red-l);border-radius:var(--r);margin-top:14px">' +
      (pt.total ? 'ยังไม่มีเคสที่ประเมินแล้วในช่วงเวลานี้' : 'ไม่มีเคสในช่วงเวลาที่เลือก') + '</div>';
  } else {
    var pg = pct(pt.rational, pt.done), pr = 100 - pg;
    html += '<div class="ovbar">' +
      (pg > 0 ? '<div class="g" style="width:' + pg + '%">' + (pg >= 12 ? fmtPct(pg) : '') + '</div>' : '') +
      (pr > 0 ? '<div class="r" style="width:' + pr + '%">' + (pr >= 12 ? fmtPct(pr) : '') + '</div>' : '') +
      '</div>';
  }

  /* มูลค่าที่เลี่ยงได้ — นับเฉพาะเคสที่อาจารย์แพทย์ยืนยันว่าไม่สมเหตุผล */
  html += '<div class="ovmoney">' +
    '<div class="m g"><span class="k">มูลค่าที่เลี่ยงได้</span>' +
      '<span class="v">' + baht(ps.saved) + '<small> ฿</small></span>' +
      '<span class="n">จาก ' + ps.savedCases + ' เคสที่อาจารย์แพทย์ยืนยันว่าไม่สมเหตุผล</span></div>' +
    '</div>';

  if (ps.unmatched.length) {
    html += '<p class="ovwarn">มี ' + ps.unmatched.length + ' เคสที่ยืนยันว่าไม่สมเหตุผลแล้วแต่ยังคิดเงินไม่ได้ ' +
      'มูลค่าจริงจึงสูงกว่าที่แสดง · <button data-page="drugs">ดูและแก้ที่หน้าราคายา</button></p>';
  }
  html += '</div>';

  /* --- ทะเบียนเคส --- */
  html += '<div class="card"><div class="card-h"><div>' +
    '<p class="eyebrow">ทะเบียนเคส</p><h3>ผลประเมินรายเคสทั้งหมด</h3></div>' +
    '<div class="legend">' +
    '<span><i style="background:var(--green)"></i>สมเหตุผล</span>' +
    '<span><i style="background:var(--red)"></i>ไม่สมเหตุผล</span>' +
    '<span><i style="background:#CFC6C7"></i>รอประเมิน</span>' +
    '<span style="color:var(--green)">✓ อาจารย์แพทย์ยืนยันแล้ว</span></div></div>' +
    '<div class="reg-ctl"><div class="reg-note">' +
      '<b>' + esc(periodLabel()) + '</b> · ' + (pt.total
        ? pt.total + ' เคส · สมเหตุผล ' + pt.rational + ' · ไม่สมเหตุผล ' + pt.irrational + ' · รอประเมิน ' + pt.pending
        : 'ไม่มีเคสในช่วงเวลานี้') +
      ' · เปลี่ยนช่วงเวลาได้ที่การ์ดภาพรวมด้านบน</div></div>';

  if (!periodCases.length) {
    html += '<div class="empty">ไม่มีเคสในช่วงเวลาที่เลือก</div>';
  } else {
    html += '<div class="reg-grid">' + periodCases.map(function (c) {
      var st = statusOf(c);
      var byDoc = !!confOf(c);
      var src = byDoc ? 'อาจารย์แพทย์ยืนยัน' : (st !== 'pending' ? 'ผลเบื้องต้นจาก AI' : 'ยังไม่ประเมิน');
      return '<button class="chip ' + statusClass(st) + '" data-case="' + esc(c.no) + '" title="เคส ' + esc(c.no) + ' · ' + statusText(st) + ' · ' + src + '">' +
        esc(c.no) + (byDoc ? '<span class="ck">✓</span>' : '') + '</button>';
    }).join('') + '</div>';
    html += '<p class="reg-hint">แตะที่หมายเลขเคสเพื่อดูบันทึกพยาบาล คำสั่งแพทย์ และผลการพิจารณาของอาจารย์แพทย์</p>';
  }
  html += '</div>';

  /* --- KPI --- */
  html += '<p class="ovnote">ตัวเลขด้านล่างนี้นับเคสทุกช่วงเวลา ไม่ขึ้นกับปี/เดือนที่เลือกด้านบน</p>';
  html += '<div class="kpis">' +
    kpi('เคสทั้งหมด', t.total, 'ใบสั่งยาปฏิชีวนะ', '') +
    kpi('สมเหตุผล', t.rational, 'รวมผลเบื้องต้นจาก AI', 'g') +
    kpi('ไม่สมเหตุผล', t.irrational, 'รวมผลเบื้องต้นจาก AI', 'r') +
    kpi('รอประเมิน', t.pending, 'ยังไม่มีผลจากใครเลย', '') +
    kpi('ร้อยละสมเหตุผล', t.done ? fmtPct(pct(t.rational, t.done)) : '—', 'Rational prescribing rate', '') +
    kpi('อาจารย์ยืนยันแล้ว', t.confirmed + '<small>/' + t.total + '</small>', 'ทุกเคสต้องผ่านการยืนยัน', '') +
    '</div>';

  /* --- ข้อบ่งชี้ + รายการยา --- */
  var indAgg = {}, drugAgg = {};
  S.cases.forEach(function (c) {
    var st = statusOf(c);
    indicationsOf(c).forEach(function (i) { bumpAgg(indAgg, i, st); });
    bumpAgg(drugAgg, drugKey(c.drug), st);
  });

  var rateLegend = '<div class="legend">' +
    '<span><i style="background:var(--green)"></i>สมเหตุผล</span>' +
    '<span><i style="background:var(--red)"></i>ไม่สมเหตุผล</span>' +
    '<span><i style="background:#E4DBDC"></i>รอประเมิน</span></div>';

  html += '<div class="cols2">' +
    '<div class="card"><div class="card-h"><div>' +
      '<p class="eyebrow">ข้อมูลเหตุผลที่สั่งใช้ยา</p><h3>ข้อบ่งชี้ที่พบในเวชระเบียน</h3></div>' + rateLegend + '</div>' +
    '<p class="sub">ร้อยละความสมเหตุผลของแต่ละข้อบ่งชี้ · คิดจากเคสที่ประเมินแล้ว</p>' +
    rationalList(indAgg) + '</div>' +
    '<div class="card"><div class="card-h"><div>' +
      '<p class="eyebrow">รายการยา</p><h3>ยาปฏิชีวนะที่ถูกสั่งใช้</h3></div>' + rateLegend + '</div>' +
    '<p class="sub">ร้อยละความสมเหตุผลของแต่ละชนิดยา · คิดจากเคสที่ประเมินแล้ว</p>' +
    rationalList(drugAgg) + '</div></div>';

  /* --- สถิติรายบุคคล --- */
  var byDoc = {};
  S.cases.forEach(function (c) {
    var n = String(c.doctor || '').trim() || '(ไม่ระบุ)';
    if (!byDoc[n]) byDoc[n] = { total: 0, rational: 0, irrational: 0, pending: 0 };
    var st = statusOf(c);
    byDoc[n].total++;
    if (st === 'rational') byDoc[n].rational++;
    else if (st === 'irrational') byDoc[n].irrational++;
    else byDoc[n].pending++;
  });
  var docs = Object.keys(byDoc).sort(function (a, b) { return byDoc[b].total - byDoc[a].total; });

  html += '<div class="card" style="margin-top:18px"><div class="card-h"><div>' +
    '<p class="eyebrow">สถิติรายบุคคล</p><h3>การสั่งใช้ยาแยกตามแพทย์ผู้สั่ง</h3>' +
    '<p class="sub">' + (S.session
      ? 'เปิดสวิตช์เพื่อแสดงชื่อแพทย์จริง'
      : 'ชื่อแพทย์ถูกปิดไว้ เข้าสู่ระบบแล้วจึงเปิดแสดงได้') + '</p></div>' +
    '<button class="sw' + (S.showDoctorNames ? ' on' : '') + '" data-act="toggleDoctors">' +
    '<span class="sw-t"></span><span>แสดงชื่อแพทย์</span></button></div>';

  if (!docs.length) {
    html += '<div class="empty">ยังไม่มีข้อมูล</div>';
  } else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>แพทย์ผู้สั่ง</th><th>ใบสั่งยา</th><th>สมเหตุผล</th><th>ไม่สมเหตุผล</th><th>รอประเมิน</th><th>ร้อยละสมเหตุผล</th>' +
      '</tr></thead><tbody>' +
      docs.map(function (n) {
        var d = byDoc[n];
        return '<tr><td>' + esc(doctorLabel(n)) + '</td><td>' + d.total + '</td><td>' + d.rational +
          '</td><td>' + d.irrational + '</td><td>' + d.pending + '</td><td>' +
          rateCell(d.rational, d.irrational, d.total) + '</td></tr>';
      }).join('') +
      '<tr class="sum"><td>รวมทั้งหมด</td><td>' + t.total + '</td><td>' + t.rational + '</td><td>' +
      t.irrational + '</td><td>' + t.pending + '</td><td>' +
      rateCell(t.rational, t.irrational, t.total) + '</td></tr>' +
      '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}

/** ป้ายบอกช่วงเวลาที่เลือกอยู่ เช่น "สิงหาคม 2569" หรือ "ทุกช่วงเวลา" */
function periodLabel() {
  var y = S.dash.year, m = S.dash.month;
  if (!y && !m) return 'ทุกช่วงเวลา';
  if (y && !m) return 'ปี พ.ศ. ' + y;
  if (!y && m) return 'เดือน' + TH_MONTHS[Number(m) - 1] + ' ทุกปี';
  return TH_MONTHS[Number(m) - 1] + ' ' + y;
}

/** ตัวเลือกปี/เดือน — ใช้ร่วมกันทุกการ์ดบนแดชบอร์ด เลือกที่ไหนก็เลื่อนตามกันหมด */
function periodPicker(years, months, pt) {
  return '<div class="reg-ctl">' +
    '<div class="fld"><label>ปี พ.ศ.</label><select data-dash="year"><option value="">ทุกปี</option>' +
      years.map(function (y) {
        return '<option value="' + y + '"' + (String(S.dash.year) === String(y) ? ' selected' : '') + '>' + y + '</option>';
      }).join('') + '</select></div>' +
    '<div class="fld"><label>เดือน</label><select data-dash="month"><option value="">ทุกเดือน</option>' +
      months.map(function (m) {
        return '<option value="' + m + '"' + (String(S.dash.month) === String(m) ? ' selected' : '') + '>' + TH_MONTHS[m - 1] + '</option>';
      }).join('') + '</select></div>' +
    '<div class="reg-note">' + (pt.total
      ? 'ช่วงที่เลือกมี ' + pt.total + ' เคส · สมเหตุผล ' + pt.rational + ' · ไม่สมเหตุผล ' + pt.irrational + ' · รอประเมิน ' + pt.pending
      : 'ไม่มีเคสในช่วงเวลาที่เลือก') + '</div></div>';
}

function kpi(k, v, n, cls) {
  return '<div class="kpi ' + cls + '"><div class="k">' + esc(k) + '</div><div class="v">' + v +
    '</div><div class="n">' + esc(n) + '</div></div>';
}

/** สะสมยอดของกลุ่มหนึ่ง ๆ ตามสถานะการประเมิน */
function bumpAgg(agg, key, st) {
  var g = agg[key] || (agg[key] = { total: 0, rational: 0, irrational: 0, pending: 0 });
  g.total++; g[st]++;
}

/** แถบสองสี: เขียว = สมเหตุผล, แดง = ไม่สมเหตุผล, ส่วนที่เหลือ = รอประเมิน */
function splitBar(rational, irrational, total, cls) {
  var g = pct(rational, total), r = pct(irrational, total);
  return '<div class="ptrack' + (cls ? ' ' + cls : '') + '">' +
    (g > 0 ? '<i class="g" style="width:' + g + '%"></i>' : '') +
    (r > 0 ? '<i class="r" style="width:' + r + '%"></i>' : '') +
    '</div>';
}

/** ช่อง "ร้อยละสมเหตุผล" ในตารางรายบุคคล — ตัวเลขกำกับ + แถบสี */
function rateCell(rational, irrational, total) {
  var done = rational + irrational;
  return '<div class="rate">' +
    '<span class="rate-n' + (done ? (rational >= irrational ? ' g' : ' r') : '') + '">' +
      (done ? fmtPct(pct(rational, done)) : '—') + '</span>' +
    splitBar(rational, irrational, total, 'mini') +
    '</div>';
}

/** รายการกลุ่ม เรียงจากกลุ่มที่พบ "ไม่สมเหตุผล" มากที่สุดก่อน */
function rationalList(agg) {
  var keys = Object.keys(agg).sort(function (a, b) {
    return (agg[b].irrational - agg[a].irrational) || (agg[b].total - agg[a].total);
  });
  if (!keys.length) return '<div class="empty">ยังไม่มีข้อมูล</div>';
  return '<div class="plist">' + keys.map(function (k) {
    var g = agg[k], done = g.rational + g.irrational;
    var right = done
      ? '<b class="' + (g.rational >= g.irrational ? 'g' : 'r') + '">' + fmtPct(pct(g.rational, done)) +
        '</b><span class="cnt">สมเหตุผล ' + g.rational + '/' + done + '</span>'
      : '<span class="cnt">ยังไม่ประเมิน ' + g.total + ' เคส</span>';
    return '<div class="prow" title="' + esc(k) + ' — ทั้งหมด ' + g.total + ' เคส · สมเหตุผล ' + g.rational +
      ' · ไม่สมเหตุผล ' + g.irrational + ' · รอประเมิน ' + g.pending + '">' +
      '<div class="t"><span>' + esc(k) + '</span><span class="rt">' + right + '</span></div>' +
      splitBar(g.rational, g.irrational, g.total) + '</div>';
  }).join('') + '</div>';
}

/** ช่องที่รับได้เฉพาะภาษาอังกฤษตัวพิมพ์ใหญ่ ตัวเลข และเครื่องหมายไม่กี่ตัว */
function bindUpperAscii(el) {
  el.addEventListener('input', function () {
    var before = el.value, pos = el.selectionStart;
    var after = before.toUpperCase().replace(/[^A-Z0-9 +\/\-.]/g, '');
    if (after === before) return;
    el.value = after;
    var back = pos - (before.length - after.length);
    try { el.setSelectionRange(back, back); } catch (e) {}
  });
}

/** ช่องที่รับได้เฉพาะตัวเลข (จำกัดจำนวนหลักได้) */
function bindDigits(el, maxLen) {
  el.addEventListener('input', function () {
    var before = el.value, pos = el.selectionStart;
    var after = before.replace(/[^\d]/g, '');
    if (maxLen) after = after.slice(0, maxLen);
    if (after === before) return;
    el.value = after;
    var back = pos - (before.length - after.length);
    try { el.setSelectionRange(back, back); } catch (e) {}
  });
}

function bindDrugForm() {
  var act = $('dgActive');
  act.addEventListener('click', function () {
    var on = !act.classList.contains('on');
    act.classList.toggle('on', on);
    act.setAttribute('aria-pressed', on ? 'true' : 'false');
  });

  bindUpperAscii($('dgGen'));
  bindDigits($('dgBaht'), 7);
  bindDigits($('dgSat'), 2);
  $('dgStrNum').addEventListener('input', function () {
    var el = $('dgStrNum');
    el.value = el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
  });
  /* สตางค์ต้องมี 2 หลักเสมอ — เติมศูนย์ให้ตอนออกจากช่อง */
  $('dgSat').addEventListener('blur', function () {
    var el = $('dgSat');
    if (el.value === '') { el.value = '00'; }
    else if (el.value.length === 1) { el.value = el.value + '0'; }
    drugPreview();
  });

  ['dgGen', 'dgForm', 'dgStrNum', 'dgStrUnit', 'dgBaht', 'dgSat', 'dgUnit'].forEach(function (id) {
    $(id).addEventListener('input', drugPreview);
    $(id).addEventListener('change', drugPreview);
  });
  $('dgCancel').addEventListener('click', closeDetail);
  $('dgSave').addEventListener('click', saveDrug);
  if ($('dgDel')) $('dgDel').addEventListener('click', deleteDrug);
  drugPreview();
}

/** ราคาที่กรอกอยู่ในฟอร์มตอนนี้ เป็นตัวเลข */
function formPrice() {
  var b = $('dgBaht').value === '' ? '0' : $('dgBaht').value;
  var st = ($('dgSat').value + '00').slice(0, 2);
  return Number(b + '.' + st);
}
/** ขนาดยาที่กรอกอยู่ เช่น "300 MG" */
function formStrength() {
  var n = String($('dgStrNum').value).trim();
  return n ? n + ' ' + $('dgStrUnit').value : '';
}

/** บอกล่วงหน้าว่าราคาที่กำลังกรอกจะมีผลกับเคสไหนบ้าง (เฉพาะเคสที่ยังไม่ถูกยืนยัน) */
function drugPreview() {
  var gen = normKey($('dgGen').value);
  var price = formPrice();
  var form = normForm($('dgForm').value);
  var str = normStrength(formStrength());
  var amt = $('dgPvAmt'), txt = $('dgPvTxt');

  if (!gen || !(price > 0)) {
    amt.textContent = '—';
    txt.textContent = 'กรอกชื่อสามัญและราคาต่อหน่วยเพื่อดูว่าราคานี้จะมีผลกับเคสไหนบ้าง';
    return;
  }

  var qty = 0, n = 0;
  S.cases.forEach(function (c) {
    if (confOf(c)) return;                     // ยืนยันแล้ว = ราคาถูกล็อกไว้แล้ว ไม่กระทบ
    var p = parseDrugText(c.drug);
    if (normKey(p.generic) !== gen) return;
    if (form && p.form && normForm(p.form) !== form) return;
    if (str && p.strength && normStrength(p.strength) !== str) return;
    if (!(p.qty > 0)) return;
    n++; qty += p.qty;
  });

  var unit = $('dgUnit').value || 'unit';
  if (!n) {
    amt.textContent = baht(price) + ' ฿ / ' + unit;
    txt.textContent = 'ยังไม่มีเคสที่รอการยืนยันและใช้ยาตัวนี้ ราคาที่ตั้งไว้จะถูกใช้เมื่อมีการยืนยันครั้งต่อไป';
  } else {
    amt.textContent = baht(price * qty) + ' ฿';
    txt.textContent = 'ถ้าอาจารย์แพทย์ยืนยันว่าไม่สมเหตุผลทั้งหมด ' + n + ' เคสที่ยังรออยู่ (รวม ' +
      qty.toLocaleString('en-US') + ' ' + unit + ') จะคิดเป็นเงินเท่านี้ · ' +
      'เคสที่ยืนยันไปแล้วยังคงราคาเดิมที่ล็อกไว้';
  }
}

function saveDrug() {
  var err = $('dgErr'), btn = $('dgSave');
  err.textContent = '';
  var gen = String($('dgGen').value).trim().toUpperCase();
  var price = formPrice();
  if (!gen) { err.textContent = 'กรุณากรอกชื่อสามัญของยา'; $('dgGen').focus(); return; }
  if ($('dgBaht').value === '' && $('dgSat').value === '') {
    err.textContent = 'กรุณากรอกราคาต่อหน่วย'; $('dgBaht').focus(); return;
  }
  if (!(price >= 0)) { err.textContent = 'ราคาต่อหน่วยไม่ถูกต้อง'; $('dgBaht').focus(); return; }

  btn.disabled = true;
  api('drugSave', {
    row: S.drugEdit ? S.drugEdit._row : 0,
    generic: gen,
    form: $('dgForm').value,
    strength: formStrength(),
    unit: $('dgUnit').value,
    price_per_unit: price.toFixed(2),
    active: $('dgActive').classList.contains('on') ? '1' : '0'
  }).then(function (dd) {
    S.drugs = dd.drugs || [];
    toast(S.drugEdit ? 'บันทึก ' + gen + ' ลงชีตแล้ว' : 'เพิ่ม ' + gen + ' ลงชีตแล้ว');
    closeDetail();
    render();
  }).catch(function (e) { err.textContent = e.message; btn.disabled = false; });
}

function deleteDrug() {

  openModal(

function fmtWhen(iso) {
  var s = String(iso || '');

  return (+m[3]) + ' ' + TH_MONTHS[(+m[2]) - 1] + ' ' + (+m[1] + 543) + ' เวลา ' + m[4] + ':' + m[5] + ' น.';

/** ผูกส่วนยืนยันเข้ากับ container (ใช้ได้ทั้งในแถวเคสและหน้ารายละเอียด) */
function mountConfirm(container, c, onSaved) {
  function paintView() {
    container.innerHTML = confirmViewHTML(c);
    var start = container.querySelector('[data-confirm-start]');
    if (start) start.addEventListener('click', function (e) { e.stopPropagation(); paintForm(); });
  }
  function paintForm() {
    container.innerHTML = confirmFormHTML(c);
    var selEl = container.querySelector('[data-cf-status]');
    var wrap = container.querySelector('[data-cf-note-wrap]');
    var note = container.querySelector('[data-cf-note]');
    var save = container.querySelector('[data-cf-save]');
    var err = container.querySelector('[data-cf-err]');

    container.addEventListener('click', function (e) { e.stopPropagation(); });
    selEl.addEventListener('change', function () {
      wrap.style.display = selEl.value ? '' : 'none';
      if (selEl.value) note.focus();
    });
    container.querySelector('[data-cf-cancel]').addEventListener('click', paintView);
    note.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSave(); });
    save.addEventListener('click', doSave);

    function doSave() {
      err.textContent = '';
      if (!selEl.value) { err.textContent = 'กรุณาเลือกผลการประเมิน'; return; }
      if (!note.value.trim()) { err.textContent = 'ต้องกรอกเหตุผลก่อนบันทึกผลการยืนยัน'; return; }
      save.disabled = true;
      api('confirm', { case_no: String(c.no), status: selEl.value, note: note.value.trim() })
        .then(function (d) {
          S.confirmations[String(c.no).trim()] = d.confirmation;
          toast('บันทึกผลการยืนยันเรียบร้อย');
          if (onSaved) onSaved();
          else { paintView(); refreshRowStatus(c); renderTabs(); renderDrawer(); updateFooter(); }
        })
        .catch(function (e2) { err.textContent = e2.message; save.disabled = false; });
    }
  }
  paintView();
}

function updateFooter() {
  var f = document.querySelector('.foot');
  if (f) f.outerHTML = viewFooter();
}

    }).join('') + '</tbody></table></div></div>';
  return html;
}

/* ช่องที่มี data-alnum: พิมพ์ได้เฉพาะ A-Z a-z 0-9 (กันภาษาไทย สัญลักษณ์ และเว้นวรรค) */
var ALNUM_RE = /^[A-Za-z0-9]+$/;
function bindAlnum(root) {
  (root || document).querySelectorAll('input[data-alnum]').forEach(function (el) {
    if (el._alnumBound) return;
    el._alnumBound = true;
    el.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Spacebar' || e.code === 'Space') e.preventDefault();
    });
    el.addEventListener('input', function () {
      var v = el.value, clean = v.replace(/[^A-Za-z0-9]/g, '');
      if (clean === v) return;
      var pos = el.selectionStart == null ? v.length : el.selectionStart;
      var keep = v.slice(0, pos).replace(/[^A-Za-z0-9]/g, '').length;
      el.value = clean;
      try { el.setSelectionRange(keep, keep); } catch (err) {}
    });
  });
}
function closeModal() { $('modal').classList.remove('on'); }
