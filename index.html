/* ===================================================== AI: ผู้ช่วยอ่าน guideline */
/*
 * กฎที่ยึดไว้ ห้ามแก้โดยไม่ตั้งใจ
 *  1) AI ไม่เปลี่ยนสถานะเคส  statusOf() ยังอ่านจาก S.confirmations อย่างเดียว
 *  2) ขอบซ้ายของแถว = ผลที่อาจารย์แพทย์ยืนยัน   จุดสี AI = คนละจุด มีคำว่า "AI" กำกับเสมอ
 *  3) เขียวคือ AI เห็นว่าสอดคล้อง guideline  แดงคืออาจไม่สอดคล้อง  เทาคือยังไม่มีผล/ข้อมูลไม่พอ
 */

var AI_LABEL = {
  appropriate:       { cls: 'g', text: 'AI: สมเหตุผล' },
  not_appropriate:   { cls: 'r', text: 'AI: ไม่สมเหตุผล' },
  insufficient_data: { cls: '',  text: 'AI: ข้อมูลไม่พอสรุป' }
};
var AI_CONF = { high: 'ความมั่นใจสูง', medium: 'ความมั่นใจปานกลาง', low: 'ความมั่นใจต่ำ' };
var AI_LS_KEY = 'rdu_ai_v1';

function aiKey(c) { return String((c && c.no !== undefined ? c.no : c) || '').trim(); }
function aiOf(c) { return S.ai.by[aiKey(c)] || null; }

function aiTitleOf(a, busy) {
  if (busy) return 'AI กำลังอ่าน guideline ให้เคสนี้';
  if (!a) return 'AI ยังไม่ได้ประเมินเคสนี้ — ผลจริงต้องรออาจารย์แพทย์ยืนยัน';
  var t = (AI_LABEL[a.opinion] || AI_LABEL.insufficient_data).text;
  if (a.summary) t += ' — ' + a.summary;
  if (AI_CONF[a.confidence]) t += ' (' + AI_CONF[a.confidence] + ')';
  if (a.unverified) t += ' ⚠ มีข้ออ้างอิงที่ตรวจไม่พบใน guideline';
  return t + ' · ข้อเสนอแนะจาก AI ไม่ใช่ผลประเมิน';
}

function aiDotHTML(c) {
  var no = aiKey(c), busy = S.ai.busyNo === no, a = aiOf(c);
  var cls, text;
  if (busy) { cls = 'busy'; text = 'AI: กำลังอ่าน…'; }
  else if (a && AI_LABEL[a.opinion]) {
    cls = AI_LABEL[a.opinion].cls;
    text = AI_LABEL[a.opinion].text + (a.unverified ? ' ⚠' : '');
  } else { cls = ''; text = 'AI: รอยืนยัน'; }
  return '<span class="aidot ' + cls + '" data-aidot="' + esc(no) + '" title="' + esc(aiTitleOf(a, busy)) +
    '"><i></i>' + esc(text) + '</span>';
}

/* อัปเดตเฉพาะจุดเดียว ไม่ re-render ทั้งหน้า จะได้ไม่กระตุกและไม่เด้ง scroll */
function aiPaintDot(no) {
  var c = S.cases.filter(function (x) { return aiKey(x) === String(no); })[0];
  if (!c) return;
  document.querySelectorAll('[data-aidot="' + cssEsc(String(no)) + '"]').forEach(function (el) {
    var tmp = document.createElement('div');
    tmp.innerHTML = aiDotHTML(c);
    el.replaceWith(tmp.firstChild);
  });
}

/* ------------------------------------------------------------ เก็บผล AI */
/* ลำดับ: Google Sheets (ผ่าน action aiList/aiSave) → ถ้า Code.gs ยังไม่มี action นี้ ใช้ localStorage ไปก่อน */

function aiReadLocal() {
  try { return JSON.parse(localStorage.getItem(AI_LS_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function aiWriteLocal(map) {
  try { localStorage.setItem(AI_LS_KEY, JSON.stringify(map)); } catch (e) {}
}

function aiLoadStored() {
  return api('aiList', { token: '' }).then(function (d) {
    S.ai.store = 'sheet'; S.ai.storeMsg = '';
    S.ai.by = {};
    (d.assessments || []).forEach(function (r) {
      var k = String(r.case_no || '').trim();
      if (k) S.ai.by[k] = r;
    });
  }).catch(function (e) {
    S.ai.store = 'local';
    S.ai.storeMsg = 'ยังบันทึกลง Google Sheets ไม่ได้ (' + (e.message || e) +
      ') — ตอนนี้เก็บผลไว้ในเบราว์เซอร์เครื่องนี้ก่อน เพิ่ม action aiList/aiSave ใน Code.gs แล้วผลจะไปอยู่บนชีตให้ทุกคนเห็นตรงกัน';
    S.ai.by = aiReadLocal();
  });
}

function aiPersist(no, rec) {
  var k = String(no).trim();
  S.ai.by[k] = rec;
  var local = aiReadLocal(); local[k] = rec; aiWriteLocal(local);   // เก็บสำเนาไว้เสมอ
  if (S.ai.store !== 'sheet') return Promise.resolve();
  return api('aiSave', {
    case_no: k, opinion: rec.opinion, confidence: rec.confidence || '',
    summary: rec.summary || '', model: rec.model || '', unverified: rec.unverified ? 1 : 0
  }).catch(function (e) {
    S.ai.storeMsg = 'บันทึกผล AI ลงชีตไม่สำเร็จ: ' + (e.message || e) + ' — ผลยังอยู่ในเบราว์เซอร์เครื่องนี้';
    aiPaintBar();
  });
}

/* ------------------------------------------------------- เรียกใช้บริการ AI */

function aiPayload(c) {
  /* ส่งเฉพาะข้อมูลทางคลินิก ไม่ส่ง HN / AN / ชื่อผู้ป่วย / ชื่อแพทย์ */
  return {
    'การวินิจฉัย': [c.icd10, c.icd10Other].filter(Boolean).join(', '),
    'หัตถการ (ICD-9)': c.icd9,
    'อายุครรภ์ (สัปดาห์)': c.week,
    'ข้อบ่งชี้ที่พบในเวชระเบียน': indicationsOf(c),
    'คำสั่งยา': c.drug,
    'Doctor order': c.doctorOrder,
    'Nurse note': c.nurseNote
  };
}

function aiCheckHealth() {
  if (!window.RDUAI) {
    S.ai.health = 'down';
    S.ai.healthMsg = 'ยังไม่ได้โหลดส่วนเชื่อมต่อ AI (rdu-ai-panel)';
    return Promise.resolve(false);
  }
  return RDUAI.health().then(function (h) {
    if (h && h.ok) { S.ai.health = 'ok'; S.ai.healthMsg = ''; return true; }
    S.ai.health = 'down';
    S.ai.healthMsg = (h && h.index && !h.index.ready)
      ? 'บริการ AI ทำงานอยู่ แต่ยังไม่ได้สร้างดัชนี guideline — สั่ง reindex ก่อน'
      : 'บริการ AI ตอบว่ายังไม่พร้อมใช้งาน';
    return false;
  }).catch(function (e) {
    S.ai.health = 'down';
    S.ai.healthMsg = 'ต่อกับบริการ AI ไม่ได้ (' + (e.message || e) + ') — ตรวจว่า ollama serve และ uvicorn ทำงานอยู่';
    return false;
  });
}

function aiPending() {
  return S.cases.filter(function (c) { return !aiOf(c); });
}

function aiStart(force) {
  if (S.ai.running || S.ai.health !== 'ok') return;
  /* ประเมินได้แม้ยังไม่เข้าสู่ระบบ — ผล AI เป็นผลเบื้องต้น
     ส่วนการยืนยันของอาจารย์แพทย์ยังต้องเข้าสู่ระบบเหมือนเดิม */
  var todo = force ? S.cases.slice() : aiPending();
  if (!todo.length) { aiPaintBar(); return; }
  S.ai.running = true; S.ai.stopped = false; S.ai.startedAt = Date.now();
  S.ai.done = 0; S.ai.fail = 0; S.ai.total = todo.length; S.ai.lastErr = '';
  aiPaintBar();
  aiRunNext(todo, 0);
}

function aiStop() {
  S.ai.stopped = true;
  aiPaintBar();
}

function aiRunNext(todo, i) {
  if (S.ai.stopped || i >= todo.length) {
    S.ai.running = false; S.ai.busyNo = null;
    aiPaintBar();
    if (S.page === 'dashboard') render();   // ทะเบียนเคสและ KPI อัปเดตครบหลังรันจบ
    return;
  }
  var c = todo[i], no = aiKey(c);
  S.ai.busyNo = no;
  aiPaintDot(no); aiPaintBar();

  RDUAI.assess(aiPayload(c)).then(function (res) {
    var reasons = res.reasons || [];
    var unverified = reasons.some(function (r) { return r && r.verified === false; });
    var rec = {
      case_no: no,
      opinion: AI_LABEL[res.opinion] ? res.opinion : 'insufficient_data',
      confidence: res.confidence || '',
      summary: res.summary || '',
      model: res.model || '',
      unverified: unverified,
      at: new Date().toISOString()
    };
    S.ai.done++;
    return aiPersist(no, rec);
  }).catch(function (e) {
    S.ai.fail++;
    S.ai.lastErr = e.message || String(e);
  }).then(function () {
    S.ai.busyNo = null;
    aiPaintDot(no);
    aiPaintBar();
    refreshRowStatus(c);                 // ผล AI เปลี่ยนสถานะเคส → แถบสีข้างแถวเปลี่ยนตาม
    renderTabs(); renderDrawer(); updateFooter();
    if (S.detailNo === no) paintDetail();
    setTimeout(function () { aiRunNext(todo, i + 1); }, 150);
  });
}

/* --------------------------------------------------------- แถบสถานะบนหน้าเคส */

function aiCounts() {
  var n = { g: 0, r: 0, x: 0, none: 0 };
  S.cases.forEach(function (c) {
    var a = aiOf(c);
    if (!a) n.none++;
    else if (a.opinion === 'appropriate') n.g++;
    else if (a.opinion === 'not_appropriate') n.r++;
    else n.x++;
  });
  return n;
}

function aiBarHTML() {
  var n = aiCounts(), left = aiPending().length;
  var head, sp = '';

  if (S.ai.health === 'unknown') {
    head = '<span class="ttl">ผู้ช่วยอ่าน guideline</span><span style="color:var(--muted)">กำลังตรวจสอบบริการ AI…</span>';
  } else if (S.ai.health !== 'ok') {
    head = '<span class="ttl">ผู้ช่วยอ่าน guideline</span><span style="color:var(--muted)">ปิดใช้งานอยู่</span>';
  } else if (S.ai.running) {
    head = '<span class="ttl">AI กำลังอ่าน guideline</span>' +
      '<span style="color:var(--muted)">' + S.ai.done + ' / ' + S.ai.total + ' เคส' +
      (S.ai.fail ? ' · ไม่สำเร็จ ' + S.ai.fail : '') + '</span>';
    sp = '<button data-act="aiStop">หยุด</button>';
  } else {
    head = '<span class="ttl">ผู้ช่วยอ่าน guideline</span>' +
      '<span style="color:var(--muted)">AI ประเมินแล้ว ' + (S.cases.length - left) + ' จาก ' + S.cases.length + ' เคส</span>';
    if (S.session) {
      sp = (left ? '<button data-act="aiStart">ให้ AI ประเมินอีก ' + left + ' เคส</button>' : '') +
           '<button data-act="aiRedo">ประเมินใหม่ทั้งหมด</button>';
    }
  }

  var pctDone = S.ai.total ? Math.round((S.ai.done + S.ai.fail) / S.ai.total * 100) : 0;

  var html = '<div class="aibar"><div class="top">' + head + '<span class="sp">' + sp + '</span></div>';
  if (S.ai.running) html += '<div class="track"><i style="width:' + pctDone + '%"></i></div>';

  html += '<div class="lg">' +
    '<span><i style="background:var(--green)"></i>AI: สมเหตุผล ' + n.g + '</span>' +
    '<span><i style="background:var(--red)"></i>AI: ไม่สมเหตุผล ' + n.r + '</span>' +
    '<span><i style="background:var(--gray)"></i>รอยืนยัน ' + (n.none + n.x) + '</span>' +
    '</div>';

  html += '<div class="ainote">จุดสีนี้เป็นข้อเสนอแนะจาก AI ไม่ใช่ผลประเมิน ' +
    'ผลที่ถือเป็นที่สุดคือแถบสีที่ขอบซ้ายของแถว ซึ่งเปลี่ยนได้เมื่ออาจารย์แพทย์ยืนยันพร้อมเหตุผลเท่านั้น</div>';

  if (S.ai.health === 'ok' && !S.session) {
    html += '<div class="msg warn">ยังไม่ได้เข้าสู่ระบบ — AI ประเมินเคสที่ยังไม่มีผลได้ตามปกติ ' +
      'แต่ประเมินซ้ำทับผลเดิม และยืนยันผลของอาจารย์แพทย์ ต้องเข้าสู่ระบบก่อน</div>';
  }
  if (S.ai.health === 'down' && S.ai.healthMsg) {
    html += '<div class="msg err">' + esc(S.ai.healthMsg) + '</div>';
  }
  if (S.ai.lastErr) {
    html += '<div class="msg err">เคสล่าสุดที่ไม่สำเร็จ: ' + esc(S.ai.lastErr) + '</div>';
  }
  if (S.ai.storeMsg) {
    html += '<div class="msg warn">' + esc(S.ai.storeMsg) + '</div>';
  }
  return html + '</div>';
}

function aiPaintBar() {
  var host = $('aiBar');
  if (host) host.innerHTML = aiBarHTML();
}

/* สรุปผล AI ที่บันทึกไว้ สำหรับหน้ารายละเอียดเคส */
function aiDetailSummaryHTML(c) {
  var a = aiOf(c);
  var html = '<div style="margin-bottom:12px">' + aiDotHTML(c) + '</div>';
  if (!a) {
    return html + '<p class="sub" style="margin:0 0 12px">ยังไม่มีผลจาก AI สำหรับเคสนี้ ' +
      'กดปุ่มข้างล่างเพื่อให้ AI อ่าน guideline ให้</p>';
  }
  html += '<div class="kv" style="margin-top:0">' +
    kv('ข้อสังเกตของ AI', esc(a.summary || '—')) +
    kv('ความมั่นใจ', esc(AI_CONF[a.confidence] || '—')) +
    kv('โมเดล', esc(a.model || '—')) +
    kv('ประเมินเมื่อ', esc(a.at ? fmtWhen(a.at) : '—')) +
    '</div>';
  if (a.unverified) {
    html += '<div class="ainote" style="color:var(--red)">⚠ ผลครั้งนั้นมีข้ออ้างอิงที่ระบบตรวจไม่พบในไฟล์ guideline ' +
      'อย่าใช้อ้างอิง ให้กดอ่านใหม่แล้วดูข้อความอ้างอิงเต็มข้างล่าง</div>';
  }
  return html;
}

/* เรียกครั้งเดียวหลังโหลดเคสเสร็จ */
function aiInit() {
  if (!S.cases.length) return;
  Promise.all([aiLoadStored(), aiCheckHealth()]).then(function () {
    render();                       // ผล AI ที่โหลดมาเปลี่ยนสถานะเคส จึงต้องวาดหน้าใหม่ก่อน
    aiPaintBar();
    S.cases.forEach(function (c) { aiPaintDot(aiKey(c)); });
    if (S.ai.health === 'ok' && aiPending().length) aiStart(false);
  });
}

/* ================================================================ wiring  */

function afterRender() {
  document.querySelectorAll('[data-cf]').forEach(function (el) {
    var no = el.getAttribute('data-cf');
    var c = S.cases.filter(function (x) { return String(x.no) === no; })[0];
    if (c) mountConfirm(el, c);
  });
}

function setPage(p) {
  S.page = p;
  closeDrawer();
  render();
  window.scrollTo({ top: 0 });
  if (p === 'users' && isAdmin()) loadUsers();
}

function openDrawer() { $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
function closeDrawer() {
  $('drawer').classList.remove('on');
  if (!$('so').classList.contains('on')) $('scrim').classList.remove('on');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-page],[data-act],[data-case],[data-open],[data-approve],[data-reject],' +
    '[data-toggle-active],[data-df],[data-drug-edit],[data-drug-del],[data-drug-off],[data-drug-del-go]');
  if (!t) return;

  /* ---- หน้าราคายา ---- */
  if (t.hasAttribute('data-df')) {
    S.df = t.getAttribute('data-df');
    render();
    return;
  }
  if (t.hasAttribute('data-drug-edit')) { openDrugForm(t.getAttribute('data-drug-edit')); return; }
  if (t.hasAttribute('data-drug-del')) {
    S.drugEdit = S.drugs.filter(function (d) { return String(d._row) === t.getAttribute('data-drug-del'); })[0] || null;
    if (S.drugEdit) deleteDrug();
    return;
  }
  if (t.hasAttribute('data-drug-off')) {
    var offRow = t.getAttribute('data-drug-off');
    var dOff = S.drugs.filter(function (d) { return String(d._row) === offRow; })[0];
    if (!dOff) { closeModal(); return; }
    api('drugSave', {
      row: dOff._row, generic: dOff.generic, form: dOff.form, strength: dOff.strength,
      unit: dOff.unit, price_per_unit: dOff.price_per_unit,
      effective_from: dOff.effective_from, active: '0'
    }).then(function (d) {
      S.drugs = d.drugs || [];
      toast('ปิดใช้งาน ' + dOff.generic + ' แล้ว ราคาย้อนหลังยังอยู่ครบ');
      closeModal(); closeDetail(); render();
    }).catch(function (err) { toast(err.message); });
    return;
  }
  if (t.hasAttribute('data-drug-del-go')) {
    var delRow = t.getAttribute('data-drug-del-go');
    var dDel = S.drugs.filter(function (d) { return String(d._row) === delRow; })[0];
    api('drugDelete', { row: delRow }).then(function (d) {
      S.drugs = d.drugs || [];
      toast('ลบ ' + (dDel ? dDel.generic : 'รายการยา') + ' ออกจากชีตแล้ว');
      closeModal(); closeDetail(); render();
    }).catch(function (err) { toast(err.message); });
    return;
  }

  if (t.hasAttribute('data-page')) { setPage(t.getAttribute('data-page')); return; }
  if (t.hasAttribute('data-case')) { openDetail(t.getAttribute('data-case')); return; }
  if (t.hasAttribute('data-open')) { openDetail(t.getAttribute('data-open')); return; }
  if (t.hasAttribute('data-approve')) {
    var idA = t.getAttribute('data-approve');
    var roleSel = document.querySelector('[data-role-for="' + cssEsc(idA) + '"]');
    api('approveUser', { id: idA, role: roleSel ? roleSel.value : 'viewer' })
      .then(function () { toast('อนุมัติเรียบร้อย'); loadUsers(); })
      .catch(function (err) { toast(err.message); });
    return;
  }
  if (t.hasAttribute('data-reject')) {
    api('rejectUser', { id: t.getAttribute('data-reject') })
      .then(function () { toast('ปฏิเสธคำขอเรียบร้อย'); loadUsers(); })
      .catch(function (err) { toast(err.message); });
    return;
  }
  if (t.hasAttribute('data-toggle-active')) {
    var idT = t.getAttribute('data-toggle-active');
    var now = t.getAttribute('data-now') === '1';
    api('setActive', { id: idT, active: now ? '0' : '1' })
      .then(function (d) { toast(d.message || 'บันทึกแล้ว'); loadUsers(); })
      .catch(function (err) { toast(err.message); });
    return;
  }

  switch (t.getAttribute('data-act')) {
    case 'syncNow': toast('กำลังดึงข้อมูลจากชีต…'); quietReload(); break;
    case 'drugNew':
      if (!canEditDrugs()) { toast('ต้องเข้าสู่ระบบด้วยบัญชีอาจารย์แพทย์หรือผู้ดูแลระบบ'); loginModal(); break; }
      openDrugForm(null);
      break;
    case 'reprice':
      if (!canEditDrugs()) { toast('ต้องเข้าสู่ระบบด้วยบัญชีอาจารย์แพทย์หรือผู้ดูแลระบบ'); loginModal(); break; }
      toast('กำลังคิดเงินย้อนหลัง…');
      api('repriceMissing', {}).then(function (d) {
        (d.confirmations || []).forEach(function (r) {
          var k = String(r.case_no || '').trim();
          if (k) S.confirmations[k] = r;
        });
        toast(d.filled
          ? 'คิดเงินย้อนหลังให้ ' + d.filled + ' เคสแล้ว' +
            (d.stillMissing ? ' · ยังขาดราคาอีก ' + d.stillMissing + ' เคส' : '')
          : 'ไม่มีเคสไหนที่คิดย้อนหลังได้ ต้องกรอกราคายาที่ขาดก่อน');
        render();
      }).catch(function (err) { toast(err.message); });
      break;
    case 'recalc': recalcPrices(); break;
    case 'recalcGo':
      closeModal();
      toast('กำลังคำนวณราคาย้อนหลังใหม่…');
      api('recalcPrices', {}).then(function (d) {
        (d.confirmations || []).forEach(function (r) {
          var k = String(r.case_no || '').trim();
          if (k) S.confirmations[k] = r;
        });
        toast(d.updated ? 'คำนวณใหม่แล้ว เปลี่ยน ' + d.updated + ' เคส' : 'ตัวเลขตรงกับราคาปัจจุบันอยู่แล้ว ไม่มีอะไรเปลี่ยน');
        render();
      }).catch(function (err) { toast(err.message); });
      break;
    case 'login': loginModal(); break;
    case 'loginModal': loginModal(); break;
    case 'registerModal': registerModal(); break;
    case 'doLogin': doLogin(); break;
    case 'doRegister': doRegister(); break;
    case 'closeModal': closeModal(); break;
    case 'logout': logout(); break;
    case 'aiStop': aiStop(); break;
    case 'aiStart': aiStart(false); break;
    case 'aiRedo':
      if (!S.session) { toast('ประเมินซ้ำทับผลเดิมได้เฉพาะผู้ที่เข้าสู่ระบบ'); loginModal(); break; }
      aiStart(true);
      break;
    case 'toggleDoctors':
      if (!S.session) { toast('เข้าสู่ระบบก่อนจึงจะแสดงชื่อแพทย์ได้'); loginModal(); break; }
      S.showDoctorNames = !S.showDoctorNames;
      render();
      break;
    case 'unconfirm':
      if (!S.detailNo) break;
      api('unconfirm', { case_no: S.detailNo }).then(function () {
        delete S.confirmations[String(S.detailNo).trim()];
        toast('ยกเลิกการยืนยันแล้ว');
        paintDetail(); render();
      }).catch(function (err) { toast(err.message); });
      break;
  }
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.hasAttribute && el.hasAttribute('data-f')) {
    var key = el.getAttribute('data-f');
    S.f[key] = el.value;
    if (key === 'year') S.f.month = '';
    render();
  } else if (el.hasAttribute && el.hasAttribute('data-dash')) {
    var dk = el.getAttribute('data-dash');
    S.dash[dk] = el.value;
    if (dk === 'year') S.dash.month = '';
    render();
  } else if (el.hasAttribute && el.hasAttribute('data-set-role')) {
    api('setRole', { id: el.getAttribute('data-set-role'), role: el.value })
      .then(function () { toast('เปลี่ยนบทบาทเรียบร้อย'); loadUsers(); })
      .catch(function (err) { toast(err.message); loadUsers(); });
  }
});

document.addEventListener('input', function (e) {
  if (e.target.hasAttribute && e.target.hasAttribute('data-dq')) {
    S.dq = e.target.value;
    clearTimeout(document._dqt);
    var dpos = e.target.selectionStart;
    document._dqt = setTimeout(function () {
      render();
      var back = document.querySelector('[data-dq]');
      if (back) { back.focus(); try { back.setSelectionRange(dpos, dpos); } catch (x) {} }
    }, 220);
    return;
  }
  if (e.target.hasAttribute && e.target.hasAttribute('data-f') && e.target.tagName === 'INPUT') {
    S.f[e.target.getAttribute('data-f')] = e.target.value;
    clearTimeout(document._qt);
    var pos = e.target.selectionStart;
    document._qt = setTimeout(function () {
      render();
      var again = document.querySelector('input[data-f="q"]');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) {} }
    }, 220);
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if ($('modal').classList.contains('on')) closeModal();
    else if ($('so').classList.contains('on')) closeDetail();
    else closeDrawer();
  }
  if (e.key === 'Enter' && $('modal').classList.contains('on')) {
    if ($('lgU')) doLogin();
    else if ($('rgU')) doRegister();
  }
});

$('burger').addEventListener('click', openDrawer);
$('dwClose').addEventListener('click', closeDrawer);
$('soClose').addEventListener('click', closeDetail);
$('scrim').addEventListener('click', function () { closeDrawer(); closeDetail(); });
$('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });

/* =================================================================== init */

restoreSession().then(function () {
  startPendingWatch();
  return loadData();
}).then(function () {
  startAutoRefresh();                 // ดึงข้อมูลจากชีตซ้ำทุก 1 นาที
  if (isAdmin()) {
    api('pendingCount', {}).then(function (d) {
      S.pendingRequests = d.pendingRequests;
      if (S.pendingRequests) toast('มีคำขอใช้งานรออนุมัติ ' + S.pendingRequests + ' รายการ');
      render();
    }).catch(function () {});
  }
});

</script>
<!-- RDU-AI-PANEL เริ่ม — ผู้ช่วยอ่าน guideline (อ่านอย่างเดียว ไม่แตะสถานะเคส) -->
<script>
/*!
 * rdu-ai-panel.js — แผง "ข้อเสนอแนะจาก AI" สำหรับเว็บ RDU
 *
 * หลักการที่ยึดไว้:
 *  1) แผงนี้ "อ่านอย่างเดียว" ไม่แตะสถานะเคส ไม่เขียนอะไรลง Google Sheets
 *  2) ทุกข้อความมีป้ายกำกับชัดเจนว่าเป็นข้อเสนอแนะ ไม่ใช่ผลประเมิน
 *  3) ข้ออ้างอิงที่ระบบตรวจไม่พบใน guideline จะถูกติดป้ายเตือนเสมอ
 *
 * วิธีใช้ใน index.html:
 *   ใส่แท็ก script ที่ชี้มาที่ไฟล์นี้ใน index.html
 *   ...
 *   RDUAI.mount(elementที่จะให้แผงไปอยู่, objectข้อมูลเคส);
 */
(function (global) {
  'use strict';

  var CFG = {
    endpoint: global.RDU_AI_ENDPOINT || 'http://127.0.0.1:8000',
    apiKey: global.RDU_AI_KEY || '',
    // ต้องล็อกอินก่อนจึงใช้ได้ — ส่งฟังก์ชันที่คืน true/false เข้ามา
    isAllowed: function () { return true; }
  };

  var LABEL = {
    appropriate: { text: 'ข้อสังเกต: สอดคล้องกับ guideline', cls: 'ok' },
    not_appropriate: { text: 'ข้อสังเกต: อาจไม่สอดคล้องกับ guideline', cls: 'warn' },
    insufficient_data: { text: 'ข้อมูลไม่พอสรุป', cls: 'neutral' }
  };
  var CONF = { high: 'ความมั่นใจสูง', medium: 'ความมั่นใจปานกลาง', low: 'ความมั่นใจต่ำ' };

  var CSS = [
    '.rdu-ai{border:1px solid #e6d7d7;border-radius:6px;padding:12px;margin-top:10px;background:#fffafa;font-size:14px;line-height:1.65}',
    '.rdu-ai h4{margin:0 0 8px;font-size:14px;font-weight:600;color:#8c1c1c;display:flex;align-items:center;gap:8px}',
    '.rdu-ai .rdu-ai-note{background:#fff3f3;border-left:3px solid #b02a2a;padding:8px 10px;border-radius:3px;color:#6b2020;font-size:12.5px;margin-bottom:10px}',
    '.rdu-ai button{background:#b02a2a;color:#fff;border:0;border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}',
    '.rdu-ai button:hover{background:#8c1c1c}',
    '.rdu-ai button[disabled]{background:#c9a9a9;cursor:not-allowed}',
    '.rdu-ai .badge{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12px;font-weight:600}',
    '.rdu-ai .badge.ok{background:#e7f3ea;color:#1f6b39}',
    '.rdu-ai .badge.warn{background:#fdeaea;color:#a02020}',
    '.rdu-ai .badge.neutral{background:#eef0f2;color:#4a5157}',
    '.rdu-ai .meta{color:#7a7a7a;font-size:12px;margin-left:auto;font-weight:400}',
    '.rdu-ai ul{margin:8px 0 0;padding-left:18px}',
    '.rdu-ai li{margin-bottom:8px}',
    '.rdu-ai blockquote{margin:4px 0 0;padding:6px 10px;background:#f6f2f2;border-left:2px solid #c9a9a9;color:#4a4444;font-size:12.5px;border-radius:0 3px 3px 0}',
    '.rdu-ai .flag{color:#a02020;font-size:12px;font-weight:600}',
    '.rdu-ai .src{margin-top:10px;font-size:12.5px;color:#5a5a5a}',
    '.rdu-ai .src summary{cursor:pointer;color:#8c1c1c}',
    '.rdu-ai .err{background:#fdeaea;border:1px solid #e8b4b4;color:#8c1c1c;padding:9px 11px;border-radius:4px}',
    '.rdu-ai .stale{background:#fbf1e2;border-left:3px solid #a5601c;color:#6b4410;padding:9px 12px;border-radius:0 3px 3px 0;font-size:13px;margin-bottom:10px}'
  ].join('');

  function injectCSS() {
    if (document.getElementById('rdu-ai-style')) return;
    var s = document.createElement('style');
    s.id = 'rdu-ai-style';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function configure(opts) {
    for (var k in opts) if (Object.prototype.hasOwnProperty.call(opts, k)) CFG[k] = opts[k];
  }

  function assess(caseObj, question) {
    var headers = { 'Content-Type': 'application/json' };
    if (CFG.apiKey) headers['X-RDU-Key'] = CFG.apiKey;

    return fetch(CFG.endpoint.replace(/\/+$/, '') + '/assess', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ case: caseObj, question: question || null })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) throw new Error(body.detail || ('เซิร์ฟเวอร์ตอบรหัส ' + r.status));
        return body;
      });
    });
  }

  function health() {
    return fetch(CFG.endpoint.replace(/\/+$/, '') + '/health').then(function (r) { return r.json(); });
  }

  function renderResult(res) {
    var lab = LABEL[res.opinion] || LABEL.insufficient_data;
    var html = '';

    html += '<div class="rdu-ai-note">' + esc(res.disclaimer || '') + '</div>';

    if (res.index_stale) {
      var ch = res.index_changes || {};
      var parts = [];
      if ((ch.added || []).length) parts.push('เพิ่ม: ' + ch.added.join(', '));
      if ((ch.removed || []).length) parts.push('ลบ: ' + ch.removed.join(', '));
      if ((ch.changed || []).length) parts.push('แก้ไข: ' + ch.changed.join(', '));
      html += '<div class="stale"><strong>⚠ ไฟล์ guideline เปลี่ยนไปหลังสร้างดัชนีครั้งล่าสุด</strong><br>' +
        (parts.length ? esc(parts.join(' · ')) + '<br>' : '') +
        'ผลข้างล่างยังอ้างอิงจากไฟล์ชุดเดิม สั่งสร้างดัชนีใหม่ก่อนใช้อ้างอิงจริง</div>';
    }
    html += '<div><span class="badge ' + lab.cls + '">' + esc(lab.text) + '</span> ';
    html += '<span class="meta">' + esc(CONF[res.confidence] || '') +
            ' · ' + esc(res.model || '') + ' · ' + esc(res.elapsed_sec || 0) + ' วินาที</span></div>';

    if (res.summary) html += '<p style="margin:9px 0 0">' + esc(res.summary) + '</p>';

    var reasons = res.reasons || [];
    if (reasons.length) {
      html += '<ul>';
      for (var i = 0; i < reasons.length; i++) {
        var r = reasons[i];
        html += '<li>' + esc(r.point);
        if (!r.verified) {
          html += ' <span class="flag">⚠ ไม่พบข้อความนี้ในไฟล์ guideline — อย่าใช้อ้างอิง</span>';
        }
        if (r.quote) {
          html += '<blockquote>“' + esc(r.quote) + '”' +
                  (r.page ? ' <span style="color:#8c6a6a">(หน้า ' + esc(r.page) + ')</span>' : '') +
                  '</blockquote>';
        }
        html += '</li>';
      }
      html += '</ul>';
    }

    if ((res.missing_info || []).length) {
      html += '<p style="margin:10px 0 0"><strong>ข้อมูลที่ยังขาด</strong></p><ul>';
      for (var j = 0; j < res.missing_info.length; j++) html += '<li>' + esc(res.missing_info[j]) + '</li>';
      html += '</ul>';
    }

    if (res.notes_for_reviewer) {
      html += '<p style="margin:10px 0 0"><strong>ขอให้อาจารย์แพทย์ตรวจซ้ำ:</strong> ' +
              esc(res.notes_for_reviewer) + '</p>';
    }

    var srcs = res.sources || [];
    if (srcs.length) {
      html += '<details class="src"><summary>ข้อความจาก guideline ที่ระบบใช้ (' + srcs.length + ' ชิ้น)</summary>';
      for (var k = 0; k < srcs.length; k++) {
        html += '<blockquote><strong>' + esc(srcs[k].source) + ' หน้า ' + esc(srcs[k].page) +
                '</strong> (คะแนนความใกล้เคียง ' + esc(srcs[k].score) + ')<br>' +
                esc(srcs[k].text) + '</blockquote>';
      }
      html += '</details>';
    }
    return html;
  }

  /**
   * วางแผงลงใน container
   * @param {HTMLElement} container  กล่องที่จะให้แผงไปอยู่
   * @param {Object|Function} caseObj ข้อมูลเคส หรือฟังก์ชันที่คืนข้อมูลเคส
   */
  function mount(container, caseObj, onResult) {
    injectCSS();
    var box = document.createElement('div');
    box.className = 'rdu-ai';
    box.innerHTML =
      '<h4>ข้อเสนอแนะจาก AI <span style="font-weight:400;color:#7a7a7a">(ไม่ใช่ผลประเมิน)</span></h4>' +
      '<button type="button">ให้ AI อ่าน guideline ให้</button>' +
      '<div class="rdu-ai-body" style="margin-top:10px"></div>';
    container.appendChild(box);

    var btn = box.querySelector('button');
    var body = box.querySelector('.rdu-ai-body');

    btn.addEventListener('click', function () {
      if (!CFG.isAllowed()) {
        body.innerHTML = '<div class="err">กรุณาเข้าสู่ระบบก่อนใช้งานส่วนนี้</div>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'กำลังอ่าน guideline ...';
      body.innerHTML = '<div style="color:#7a7a7a">โมเดลกำลังทำงานบนเครื่อง อาจใช้เวลา 10–60 วินาที</div>';

      var data = typeof caseObj === 'function' ? caseObj() : caseObj;
      assess(data)
        .then(function (res) {
          body.innerHTML = renderResult(res);
          if (typeof onResult === 'function') { try { onResult(res); } catch (e) {} }
        })
        .catch(function (err) {
          body.innerHTML = '<div class="err"><strong>เรียกใช้ AI ไม่สำเร็จ</strong><br>' + esc(err.message) +
            '<br><span style="font-size:12px">ตรวจว่า ollama serve และ uvicorn ทำงานอยู่ แล้วเปิด ' +
            esc(CFG.endpoint) + '/health ดูสถานะ</span></div>';
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = 'ให้ AI อ่าน guideline ให้อีกครั้ง';
        });
    });

    return box;
  }

  global.RDUAI = { configure: configure, assess: assess, health: health, mount: mount, render: renderResult };
})(window);

</script>

<!-- ===================================================================
     แผง "ข้อเสนอแนะจาก AI" สำหรับเว็บ NL_ATB_Audit  (ฉบับแปะก้อนเดียว)
     วิธีใช้: คัดลอกทั้งไฟล์นี้ แล้ววางไว้ "ก่อนบรรทัด </body>" ใน index.html
     ไม่ต้องสร้างไฟล์ .js แยก ไม่ต้องคัดลอกไฟล์ไปไหน
     =================================================================== -->
<script>
/*!
 * rdu-ai-panel.js — แผง "ข้อเสนอแนะจาก AI" สำหรับเว็บ RDU
 *
 * หลักการที่ยึดไว้:
 *  1) แผงนี้ "อ่านอย่างเดียว" ไม่แตะสถานะเคส ไม่เขียนอะไรลง Google Sheets
 *  2) ทุกข้อความมีป้ายกำกับชัดเจนว่าเป็นข้อเสนอแนะ ไม่ใช่ผลประเมิน
 *  3) ข้ออ้างอิงที่ระบบตรวจไม่พบใน guideline จะถูกติดป้ายเตือนเสมอ
 *
 * วิธีใช้ใน index.html:
 *   ใส่แท็ก script ที่ชี้มาที่ไฟล์นี้ใน index.html
 *   ...
 *   RDUAI.mount(elementที่จะให้แผงไปอยู่, objectข้อมูลเคส);
 */
(function (global) {
  'use strict';

  var CFG = {
    endpoint: global.RDU_AI_ENDPOINT || 'http://127.0.0.1:8000',
    apiKey: global.RDU_AI_KEY || '',
    // ต้องล็อกอินก่อนจึงใช้ได้ — ส่งฟังก์ชันที่คืน true/false เข้ามา
    isAllowed: function () { return true; }
  };

  var LABEL = {
    appropriate: { text: 'ข้อสังเกต: สอดคล้องกับ guideline', cls: 'ok' },
    not_appropriate: { text: 'ข้อสังเกต: อาจไม่สอดคล้องกับ guideline', cls: 'warn' },
    insufficient_data: { text: 'ข้อมูลไม่พอสรุป', cls: 'neutral' }
  };
  var CONF = { high: 'ความมั่นใจสูง', medium: 'ความมั่นใจปานกลาง', low: 'ความมั่นใจต่ำ' };

  var CSS = [
    '.rdu-ai{border:1px solid #e6d7d7;border-radius:6px;padding:12px;margin-top:10px;background:#fffafa;font-size:14px;line-height:1.65}',
    '.rdu-ai h4{margin:0 0 8px;font-size:14px;font-weight:600;color:#8c1c1c;display:flex;align-items:center;gap:8px}',
    '.rdu-ai .rdu-ai-note{background:#fff3f3;border-left:3px solid #b02a2a;padding:8px 10px;border-radius:3px;color:#6b2020;font-size:12.5px;margin-bottom:10px}',
    '.rdu-ai button{background:#b02a2a;color:#fff;border:0;border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}',
    '.rdu-ai button:hover{background:#8c1c1c}',
    '.rdu-ai button[disabled]{background:#c9a9a9;cursor:not-allowed}',
    '.rdu-ai .badge{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12px;font-weight:600}',
    '.rdu-ai .badge.ok{background:#e7f3ea;color:#1f6b39}',
    '.rdu-ai .badge.warn{background:#fdeaea;color:#a02020}',
    '.rdu-ai .badge.neutral{background:#eef0f2;color:#4a5157}',
    '.rdu-ai .meta{color:#7a7a7a;font-size:12px;margin-left:auto;font-weight:400}',
    '.rdu-ai ul{margin:8px 0 0;padding-left:18px}',
    '.rdu-ai li{margin-bottom:8px}',
    '.rdu-ai blockquote{margin:4px 0 0;padding:6px 10px;background:#f6f2f2;border-left:2px solid #c9a9a9;color:#4a4444;font-size:12.5px;border-radius:0 3px 3px 0}',
    '.rdu-ai .flag{color:#a02020;font-size:12px;font-weight:600}',
    '.rdu-ai .src{margin-top:10px;font-size:12.5px;color:#5a5a5a}',
    '.rdu-ai .src summary{cursor:pointer;color:#8c1c1c}',
    '.rdu-ai .err{background:#fdeaea;border:1px solid #e8b4b4;color:#8c1c1c;padding:9px 11px;border-radius:4px}',
    '.rdu-ai .stale{background:#fbf1e2;border-left:3px solid #a5601c;color:#6b4410;padding:9px 12px;border-radius:0 3px 3px 0;font-size:13px;margin-bottom:10px}'
  ].join('');

  function injectCSS() {
    if (document.getElementById('rdu-ai-style')) return;
    var s = document.createElement('style');
    s.id = 'rdu-ai-style';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function configure(opts) {
    for (var k in opts) if (Object.prototype.hasOwnProperty.call(opts, k)) CFG[k] = opts[k];
  }

  function assess(caseObj, question) {
    var headers = { 'Content-Type': 'application/json' };
    if (CFG.apiKey) headers['X-RDU-Key'] = CFG.apiKey;

    return fetch(CFG.endpoint.replace(/\/+$/, '') + '/assess', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ case: caseObj, question: question || null })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) throw new Error(body.detail || ('เซิร์ฟเวอร์ตอบรหัส ' + r.status));
        return body;
      });
    });
  }

  function health() {
    return fetch(CFG.endpoint.replace(/\/+$/, '') + '/health').then(function (r) { return r.json(); });
  }

  function renderResult(res) {
    var lab = LABEL[res.opinion] || LABEL.insufficient_data;
    var html = '';

    html += '<div class="rdu-ai-note">' + esc(res.disclaimer || '') + '</div>';

    if (res.index_stale) {
      var ch = res.index_changes || {};
      var parts = [];
      if ((ch.added || []).length) parts.push('เพิ่ม: ' + ch.added.join(', '));
      if ((ch.removed || []).length) parts.push('ลบ: ' + ch.removed.join(', '));
      if ((ch.changed || []).length) parts.push('แก้ไข: ' + ch.changed.join(', '));
      html += '<div class="stale"><strong>⚠ ไฟล์ guideline เปลี่ยนไปหลังสร้างดัชนีครั้งล่าสุด</strong><br>' +
        (parts.length ? esc(parts.join(' · ')) + '<br>' : '') +
        'ผลข้างล่างยังอ้างอิงจากไฟล์ชุดเดิม สั่งสร้างดัชนีใหม่ก่อนใช้อ้างอิงจริง</div>';
    }
    html += '<div><span class="badge ' + lab.cls + '">' + esc(lab.text) + '</span> ';
    html += '<span class="meta">' + esc(CONF[res.confidence] || '') +
            ' · ' + esc(res.model || '') + ' · ' + esc(res.elapsed_sec || 0) + ' วินาที</span></div>';

    if (res.summary) html += '<p style="margin:9px 0 0">' + esc(res.summary) + '</p>';

    var reasons = res.reasons || [];
    if (reasons.length) {
      html += '<ul>';
      for (var i = 0; i < reasons.length; i++) {
        var r = reasons[i];
        html += '<li>' + esc(r.point);
        if (!r.verified) {
          html += ' <span class="flag">⚠ ไม่พบข้อความนี้ในไฟล์ guideline — อย่าใช้อ้างอิง</span>';
        }
        if (r.quote) {
          html += '<blockquote>“' + esc(r.quote) + '”' +
                  (r.page ? ' <span style="color:#8c6a6a">(หน้า ' + esc(r.page) + ')</span>' : '') +
                  '</blockquote>';
        }
        html += '</li>';
      }
      html += '</ul>';
    }

    if ((res.missing_info || []).length) {
      html += '<p style="margin:10px 0 0"><strong>ข้อมูลที่ยังขาด</strong></p><ul>';
      for (var j = 0; j < res.missing_info.length; j++) html += '<li>' + esc(res.missing_info[j]) + '</li>';
      html += '</ul>';
    }

    if (res.notes_for_reviewer) {
      html += '<p style="margin:10px 0 0"><strong>ขอให้อาจารย์แพทย์ตรวจซ้ำ:</strong> ' +
              esc(res.notes_for_reviewer) + '</p>';
    }

    var srcs = res.sources || [];
    if (srcs.length) {
      html += '<details class="src"><summary>ข้อความจาก guideline ที่ระบบใช้ (' + srcs.length + ' ชิ้น)</summary>';
      for (var k = 0; k < srcs.length; k++) {
        html += '<blockquote><strong>' + esc(srcs[k].source) + ' หน้า ' + esc(srcs[k].page) +
                '</strong> (คะแนนความใกล้เคียง ' + esc(srcs[k].score) + ')<br>' +
                esc(srcs[k].text) + '</blockquote>';
      }
      html += '</details>';
    }
    return html;
  }

  /**
   * วางแผงลงใน container
   * @param {HTMLElement} container  กล่องที่จะให้แผงไปอยู่
   * @param {Object|Function} caseObj ข้อมูลเคส หรือฟังก์ชันที่คืนข้อมูลเคส
   */
  function mount(container, caseObj) {
    injectCSS();
    var box = document.createElement('div');
    box.className = 'rdu-ai';
    box.innerHTML =
      '<h4>ข้อเสนอแนะจาก AI <span style="font-weight:400;color:#7a7a7a">(ไม่ใช่ผลประเมิน)</span></h4>' +
      '<button type="button">ให้ AI อ่าน guideline ให้</button>' +
      '<div class="rdu-ai-body" style="margin-top:10px"></div>';
    container.appendChild(box);

    var btn = box.querySelector('button');
    var body = box.querySelector('.rdu-ai-body');

    btn.addEventListener('click', function () {
      if (!CFG.isAllowed()) {
        body.innerHTML = '<div class="err">กรุณาเข้าสู่ระบบก่อนใช้งานส่วนนี้</div>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'กำลังอ่าน guideline ...';
      body.innerHTML = '<div style="color:#7a7a7a">โมเดลกำลังทำงานบนเครื่อง อาจใช้เวลา 10–60 วินาที</div>';

      var data = typeof caseObj === 'function' ? caseObj() : caseObj;
      assess(data)
        .then(function (res) { body.innerHTML = renderResult(res); })
        .catch(function (err) {
          body.innerHTML = '<div class="err"><strong>เรียกใช้ AI ไม่สำเร็จ</strong><br>' + esc(err.message) +
            '<br><span style="font-size:12px">ตรวจว่า ollama serve และ uvicorn ทำงานอยู่ แล้วเปิด ' +
            esc(CFG.endpoint) + '/health ดูสถานะ</span></div>';
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = 'ให้ AI อ่าน guideline ให้อีกครั้ง';
        });
    });

    return box;
  }

  global.RDUAI = { configure: configure, assess: assess, health: health, mount: mount, render: renderResult };
})(window);

</script>

      '<input id="rduT1" placeholder="การวินิจฉัย" style="width:100%;margin-bottom:6px;padding:7px;' +

      '<textarea id="rduT2" rows="3" placeholder="คำสั่งยา (ข้อความเต็มตามชีต)" ' +
      'style="width:100%;margin-bottom:6px;padding:7px;border:1px solid #d3c3c1;border-radius:3px;' +
      'font-family:inherit"></textarea>' +
      '<input id="rduT3" placeholder="ข้อบ่งใช้ที่ระบุ" style="width:100%;padding:7px;' +
      'border:1px solid #d3c3c1;border-radius:3px;font-family:inherit">' +
      '<div id="rduTmount"></div>';

    document.body.appendChild(btn);
    document.body.appendChild(box);

    btn.addEventListener('click', function () {
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    });

    RDUAI.mount(box.querySelector('#rduTmount'), function () {
      return {
        'การวินิจฉัย': box.querySelector('#rduT1').value,
        'คำสั่งยา': box.querySelector('#rduT2').value,
        'ข้อบ่งใช้ที่ระบุ': box.querySelector('#rduT3').value
      };
    });
  })();
</script>
